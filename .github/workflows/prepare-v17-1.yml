name: Prepare Display App v17.1 encoding fix
on:
  push:
    branches: [release/v17.1]
permissions:
  contents: write
jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, '[v17.1-generated]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v17.1 encoding repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected text for {label}')
              return text.replace(old, new, 1)

          # Frontend: explicit UTF-8 before any text, ASCII-safe combining-mark regex, version bump.
          path = 'public/index.html'
          s = read(path)
          if '<meta charset="utf-8">' not in s.lower():
              s = replace_once(s, '<head>\n', '<head>\n  <meta charset="utf-8">\n', 'HTML charset')
          s = s.replace('Display App v17.0', 'Display App v17.1')
          s = s.replace("const DISPLAY_APP_VERSION = '17.0';", "const DISPLAY_APP_VERSION = '17.1';")
          raw_range = ".replace(/[\u0300-\u036f]/g, '')"
          literal_range = ".replace(/[̀-ͯ]/g, '')"
          if literal_range not in s and raw_range not in s:
              raise SystemExit('Expected Unicode normalization regex not found')
          s = s.replace(literal_range, raw_range)
          write(path, s)

          # Worker: HTML assets always advertise UTF-8 explicitly.
          path = 'src/worker.js'
          s = read(path)
          marker = "    const asset = await env.ASSETS.fetch(request);\n    const headers = new Headers(asset.headers);\n"
          addition = marker + "    const contentType = String(headers.get('Content-Type') || '').toLowerCase();\n    if (url.pathname === '/' || url.pathname.endsWith('.html') || contentType.startsWith('text/html')) {\n      headers.set('Content-Type', 'text/html; charset=utf-8');\n    }\n"
          if "headers.set('Content-Type', 'text/html; charset=utf-8')" not in s:
              s = replace_once(s, marker, addition, 'Worker UTF-8 Content-Type')
          write(path, s)

          # Runtime and package version.
          path = 'src/settings.js'
          s = read(path).replace("export const VERSION = '17.0';", "export const VERSION = '17.1';")
          write(path, s)
          path = 'package.json'
          package = json.loads(read(path))
          package['version'] = '17.1.0'
          write(path, json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          # API tests expect the new runtime version.
          path = 'tests/api.test.js'
          s = read(path).replace("'17.0'", "'17.1'")
          write(path, s)

          # Static regression checks.
          path = 'scripts/check.js'
          s = read(path)
          s = s.replace("assert.match(html, /const DISPLAY_APP_VERSION = '17\\.0'/);", "assert.match(html, /const DISPLAY_APP_VERSION = '17\\.1'/);")
          anchor = "assert.match(html, /const REMINDER_VIEWPORT_PULSE_MS = 10000/);\n"
          extra = anchor + "assert.match(html, /<meta charset=\\\"utf-8\\\">/i);\nassert.ok(html.includes(\".replace(/[\\\\u0300-\\\\u036f]/g, '')\"));\n"
          if 'meta charset' not in s:
              s = replace_once(s, anchor, extra, 'static charset checks')
          write(path, s)

          # Real workerd regression: header + document declaration + ASCII-safe regex.
          path = 'scripts/workerd-smoke.js'
          s = read(path)
          old = "  assert.equal(document.status,200);\n  assert.match(await document.text(),/DISPLAY_APP_VERSION = '17.0'/);\n"
          new = "  assert.equal(document.status,200);\n  assert.match(document.headers.get('content-type') || '', /^text\\/html;\\s*charset=utf-8/i);\n  const documentText=await document.text();\n  assert.match(documentText,/DISPLAY_APP_VERSION = '17.1'/);\n  assert.match(documentText,/<meta charset=\\\"utf-8\\\">/i);\n  assert.ok(documentText.includes(\".replace(/[\\\\u0300-\\\\u036f]/g, '')\"));\n"
          s = replace_once(s, old, new, 'workerd encoding regression')
          s = s.replace("body.version,'17.0'", "body.version,'17.1'")
          write(path, s)

          # Browser test version assertion.
          path = 'tests/browser_check.py'
          s = read(path).replace("=='17.0'", "=='17.1'")
          write(path, s)

          # Current-facing documentation only; provenance remains the v16.5 source record.
          path = 'README.md'
          s = read(path)
          s = s.replace('# Display App v17.0', '# Display App v17.1', 1)
          marker = '## Změny proti v16.5\n\n'
          if 'UTF-8 kódování HTML' not in s:
              s = replace_once(s, marker, marker + '- v17.1: explicitní UTF-8 deklarace v HTML i HTTP hlavičce; Unicode normalizační regex je ASCII-safe.\n', 'README v17.1 note')
          write(path, s)

          path = 'docs/PARITY.md'
          s = read(path)
          s = s.replace('# Přenos v16.5 → v17.0', '# Přenos v16.5 → v17.1', 1)
          s = s.replace('Verze 17.0.', 'Verze 17.1.')
          if 'UTF-8' not in s:
              s += '\n## Oprava v17.1\n\nHTML explicitně deklaruje UTF-8 v dokumentu i HTTP odpovědi a normalizační regex používá ASCII escape, aby se JavaScript nerozbil při chybném autodetekování znakové sady. `workerd-smoke.js` tuto cestu regresně kontroluje.\n'
          write(path, s)

          path = 'docs/OPERATIONS.md'
          s = read(path)
          if '## Aktuální verze v17.1' not in s:
              insert = '# Provoz Display App v17.0 z ChatGPT\n\n'
              note = '## Aktuální verze v17.1\n\nProdukční kód je nyní v17.1. Oproti v17.0 opravuje pouze načítání frontendu na reálném telefonu: explicitní UTF-8 v HTML i HTTP hlavičce a ASCII-safe normalizační regex. Make bridge a API smlouva se nemění. Níže uvedené v17.0 live testy zůstávají historickým záznamem původního vydání.\n\n'
              s = replace_once(s, insert, insert + note, 'operations v17.1 note')
          write(path, s)
          PY
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir /tmp/display-build
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: node scripts/workerd-smoke.js
      - name: Commit validated v17.1 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html src/worker.js src/settings.js package.json package-lock.json tests/api.test.js scripts/check.js scripts/workerd-smoke.js tests/browser_check.py README.md docs/PARITY.md docs/OPERATIONS.md
          git diff --cached --check
          git commit -m 'Display App v17.1: fix UTF-8 frontend initialization [v17.1-generated]'
          git push
