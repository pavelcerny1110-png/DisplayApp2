name: Import verified release package
on:
  push:
    branches: ['release/**']
    paths: ['.bootstrap/**']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact tested UTF-8 files
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma
          root = Path('.bootstrap')
          manifest = json.loads((root / 'manifest.json').read_text())
          encoded = ''.join(p.read_text().strip() for p in sorted(root.glob('part*.b64')))
          archive = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(archive).hexdigest() == manifest['archiveSHA256'], 'Transfer checksum mismatch'
          files = json.loads(lzma.decompress(archive))
          assert set(files) == set(manifest['files']), 'Incomplete release'
          for name, text in files.items():
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] not in ('.git', '.github', '.bootstrap')
              assert hashlib.sha256(text.encode()).hexdigest() == manifest['files'][name], name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
          print('Restored and verified', len(files), 'complete source files')
          PY
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir /tmp/display-build
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: node scripts/workerd-smoke.js
      - name: Commit validated full source
        run: |
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Display App v17.0: complete Cloudflare source, verified SQLite runtime and parity tests'
          git push origin "HEAD:${GITHUB_REF_NAME}"
