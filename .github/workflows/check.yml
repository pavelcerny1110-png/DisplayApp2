name: Validate Display App
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir /tmp/display-build
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: node scripts/workerd-smoke.js
      - run: npx playwright install --with-deps chromium
      - run: node tests/counter-browser-check.js
      - name: Existing display gesture regressions
        run: |
          python3 -m venv /tmp/display-browser-venv
          /tmp/display-browser-venv/bin/pip install playwright==1.62.1
          CHROMIUM="$(node -p "require('playwright').chromium.executablePath()")" /tmp/display-browser-venv/bin/python tests/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DisplayApp-v19-browser-checks
          path: |
            browser-screenshots/
            test-results/
          retention-days: 30
