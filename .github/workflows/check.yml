name: Validate Display App
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir /tmp/display-build
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: node scripts/workerd-smoke.js
      - run: npx playwright install --with-deps chromium
      - run: node tests/counter-browser-check.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DisplayApp-v19-browser-checks
          path: browser-screenshots/
          retention-days: 30
