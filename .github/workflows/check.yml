name: Validate Display App
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir /tmp/display-build
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: node scripts/workerd-smoke.js
