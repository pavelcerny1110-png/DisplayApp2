name: v18 release maintenance
on:
  push:
    branches: [release/v18.0]
    paths: ['.github/workflows/v18-maintenance.yml']
permissions:
  contents: write
jobs:
  patch-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v18.0
      - name: Update v18 test and lock metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/api.test.js')
          p.write_text(p.read_text().replace("'17.2'", "'18.0'"), encoding='utf-8')
          import json
          p = Path('package-lock.json')
          data = json.loads(p.read_text())
          data['version'] = '18.0.0'
          data['packages']['']['version'] = '18.0.0'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit exact maintenance changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/api.test.js package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m "v18.0: align regression and lock metadata"
          git push origin HEAD:release/v18.0
