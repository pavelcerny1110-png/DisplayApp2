<!DOCTYPE html>
<!-- Display App v17.0 — Optimistic UI, Service Date Migration and Battery Warnings -->
<html lang="cs">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#111318">
  <!-- Display App v16: manuální ovládání karet, trvalý order log, časované Připomínky a nonstop Alert siréna; funkce v15 zachovány -->
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #111318;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }
    body.light { background: #f4f5f7; color: #18191c; }
    :root {
      --app-padding: 20px;
      --content-gap: 16px;
      --card-padding: 22px;
      --card-radius: 18px;
      --viewport-height: 100vh;
    }

    #app {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      min-height: var(--viewport-height);
      padding: var(--app-padding);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    .topbar-main {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .screen-title {
      min-width: 0;
      font-size: clamp(24px, 4vw, 42px);
      font-weight: 800;
      line-height: 1.1;
    }
    .fullscreen-toggle {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 9px 13px;
      border: 1px solid #3b414c;
      border-radius: 12px;
      background: #20242b;
      color: #e8eaed;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .fullscreen-toggle:active { transform: scale(0.97); }
    .fullscreen-icon { font-size: 19px; line-height: 1; }
    body.light .fullscreen-toggle {
      background: #fff;
      border-color: #cfd3da;
      color: #25272b;
    }
    .topbar-status {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 72px;
      color: #d9dce1;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      transition: color 220ms ease;
    }
    .topbar-status[hidden] { display: none !important; }
    .compact-clock {
      font-size: clamp(18px, 2.4vw, 28px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.02em;
    }
    .connection-warning {
      display: none;
      font-size: clamp(18px, 2.4vw, 27px);
      line-height: 1;
    }
    .topbar-status.connection-error { color: #ff5d5d; }
    .topbar-status.connection-error .connection-warning { display: inline-block; }
    body.light .topbar-status { color: #34373c; }
    body.light .topbar-status.connection-error { color: #d72f2f; }

    #content {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: var(--content-gap);
      align-items: start;
    }
    .display-tier {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: var(--content-gap);
      align-items: start;
      min-width: 0;
    }
    .display-item { min-width: 0; }
    .span-12 { grid-column: span 12; }
    .span-8 { grid-column: span 8; }
    .span-6 { grid-column: span 6; }
    .span-4 { grid-column: span 4; }

    .empty {
      grid-column: 1 / -1;
      min-height: 65vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .empty-title {
      font-size: clamp(30px, 5vw, 60px);
      font-weight: 800;
      color: #d9dce1;
      margin-bottom: 28px;
    }
    body.light .empty-title { color: #25272b; }
    .empty-clock {
      font-size: clamp(72px, 18vw, 190px);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
    }
    .empty-date {
      margin-top: 24px;
      font-size: clamp(20px, 4vw, 38px);
      color: #aeb3bc;
      font-weight: 500;
    }
    body.light .empty-date { color: #666b74; }
    .empty-warning {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
      color: #ff5d5d;
      text-align: center;
    }
    .empty-warning-icon {
      font-size: clamp(42px, 8vw, 78px);
      line-height: 1;
    }
    .empty-warning-text {
      font-size: clamp(20px, 3.5vw, 36px);
      font-weight: 800;
      line-height: 1.15;
    }
    .empty.connection-error .empty-title { display: none; }
    .empty.connection-error .empty-clock { color: #ff5d5d; }
    .empty.connection-error .empty-warning { display: flex; }
    body.light .empty.connection-error .empty-clock,
    body.light .empty.connection-error .empty-warning { color: #d72f2f; }

    .card {
      background: #1b1e24;
      border: 1px solid #2d3139;
      border-radius: var(--card-radius);
      padding: var(--card-padding);
      overflow: hidden;
      overflow-wrap: anywhere;
      transition: border-color 280ms ease, opacity 280ms ease;
    }
    body.light .card { background: #fff; border-color: #d9dce1; }
    .card.completed { opacity: 0.65; }
    .card.cancelled { opacity: 0.48; }
    .card.high { border-width: 2px; border-color: #ffb84d; }
    .card.urgent { border-width: 3px; border-color: #ff5d5d; }

    .section-label {
      color: #8f949d;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      margin-bottom: 12px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }
    .card-title {
      min-width: 0;
      font-size: clamp(23px, 3.5vw, 38px);
      font-weight: 800;
      line-height: 1.12;
    }
    .card-subtitle {
      margin-top: 7px;
      color: #aeb3bc;
      font-size: clamp(15px, 2vw, 21px);
      line-height: 1.35;
    }
    body.light .card-subtitle { color: #666b74; }
    .card-body {
      margin-top: 16px;
      font-size: clamp(17px, 2.4vw, 25px);
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .status {
      flex-shrink: 0;
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #30343d;
    }
    .status.waiting { background: #6b5312; color: #ffe292; }
    .status.completed { background: #195333; color: #aaf0c4; }
    .status.cancelled { background: #5a2929; color: #ffb3b3; }

    .card.order {
      border: 3px solid #f3bb3f;
      will-change: border-color, opacity;
    }
    .card.order.waiting { border-color: #f3bb3f; }
    .card.order.completed { border-color: #48c774; }
    .card.order.cancelled { border-color: #ff5d5d; }
    .order-lines {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: clamp(17px, 2.4vw, 25px);
      line-height: 1.45;
    }
    .order-line { white-space: pre-wrap; }
    .order-line.served-item {
      text-decoration-line: line-through;
      text-decoration-thickness: 2px;
      text-decoration-color: #7fe3a2;
      opacity: 0.52;
    }
    .order-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 20px;
    }
    .order-timer {
      color: #f3bb3f;
      font-size: clamp(25px, 4vw, 40px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }
    body.light .order-timer { color: #8c6200; }

    .checklist { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
    .checklist-row {
      display: flex;
      gap: 13px;
      align-items: flex-start;
      font-size: clamp(18px, 2.6vw, 27px);
      line-height: 1.35;
    }
    .check-circle {
      width: 21px;
      height: 21px;
      flex-shrink: 0;
      border: 2px solid #aeb3bc;
      border-radius: 6px;
      margin-top: 4px;
    }

    .message-card { padding: clamp(28px, 5vw, 60px); text-align: center; }
    .message-title { font-size: clamp(38px, 8vw, 90px); line-height: 1.05; font-weight: 900; }
    .message-subtitle { margin-top: 18px; font-size: clamp(18px, 3vw, 32px); color: #aeb3bc; }

    .media-card { padding: 0; }
    .media-image-wrapper {
      width: 100%;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090a0d;
      overflow: hidden;
    }
    body.light .media-image-wrapper { background: #e6e7ea; }
    .media-image { display: block; width: 100%; max-height: 72vh; object-fit: contain; }
    .media-image.cover { height: min(70vh, 750px); object-fit: cover; }
    .media-info { padding: 20px 22px 23px; }
    .media-title { font-size: clamp(22px, 3.4vw, 36px); font-weight: 800; }
    .media-caption { margin-top: 8px; color: #aeb3bc; font-size: clamp(16px, 2vw, 22px); line-height: 1.4; }
    .media-error { padding: 45px 20px; color: #ff9696; text-align: center; font-size: 20px; font-weight: 700; }

    .media-split { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(260px, 0.75fr); }
    .media-split.reverse { grid-template-columns: minmax(260px, 0.75fr) minmax(0, 1.25fr); }
    .media-split-text { padding: 28px; }
    .media-split-title { font-size: clamp(26px, 4vw, 42px); font-weight: 800; }
    .media-split-body { margin-top: 14px; font-size: clamp(17px, 2.2vw, 24px); line-height: 1.45; white-space: pre-wrap; }

    .gallery { display: grid; gap: 8px; background: #090a0d; }
    .gallery.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .gallery.three, .gallery.many { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .gallery-item { min-width: 0; position: relative; overflow: hidden; }
    .gallery-image { width: 100%; height: 280px; display: block; object-fit: cover; }
    .gallery-caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 22px 12px 10px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.78));
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    .table-wrap { margin-top: 18px; overflow-x: auto; }
    .display-table { width: 100%; border-collapse: collapse; font-size: clamp(15px, 2vw, 21px); }
    .display-table th, .display-table td { padding: 12px 14px; border-bottom: 1px solid #30343d; text-align: left; }
    body.light .display-table th, body.light .display-table td { border-color: #d9dce1; }
    .display-table th { color: #aeb3bc; font-size: 0.85em; text-transform: uppercase; }


    /* =====================================================
       PROVOZNÍ KARTY v13 — připomínky / tipy / informace / upozornění
       ===================================================== */
    .order-group,
    .operational-entry {
      min-width: 0;
    }
    .operational-entry > .operational-card {
      height: 100%;
    }

    .operational-card {
      --operational-accent: #4d9cff;
      --operational-accent-rgb: 77, 156, 255;
      position: relative;
      border: 3px solid var(--operational-accent);
      padding: clamp(20px, 2.6vw, 30px);
      box-shadow: inset 0 0 0 1px rgba(var(--operational-accent-rgb), 0.10);
      isolation: isolate;
    }
    .operational-card.completed {
      opacity: 0.72;
      filter: saturate(0.72);
    }
    .operational-reminder,
    .operational-tip {
      --operational-accent: #4d9cff;
      --operational-accent-rgb: 77, 156, 255;
      border-color: #4d9cff;
    }
    .operational-info {
      --operational-accent: #f3f5f8;
      --operational-accent-rgb: 243, 245, 248;
      border-color: rgba(243, 245, 248, 0.92);
    }
    body.light .operational-info {
      --operational-accent: #343a43;
      --operational-accent-rgb: 52, 58, 67;
      border-color: #343a43;
    }
    .operational-alert {
      --operational-accent: #ff4f55;
      --operational-accent-rgb: 255, 79, 85;
      border-color: #ff4f55;
      padding-top: clamp(30px, 4vw, 44px);
    }
    .operational-alert:not(.completed):not(.cancelled) {
      animation: alertBorderPulse 1.35s ease-in-out infinite;
    }
    .operational-alert.alert-alarm-toggle {
      cursor: pointer;
      touch-action: pan-y pinch-zoom;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transform: scale(1);
      transition: transform 82ms ease-out;
    }
    .operational-alert.alert-alarm-toggle.alert-press-active {
      transform: scale(0.985);
    }
    .operational-alert.alert-alarm-toggle:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.96);
      outline-offset: 4px;
    }
    body.light .operational-alert.alert-alarm-toggle:focus-visible {
      outline-color: rgba(25, 28, 33, 0.92);
    }

    .operational-chrome {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin-bottom: 13px;
      min-height: 24px;
    }
    .operational-kind {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--operational-accent);
      font-size: 13px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }
    .operational-kind-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      font-size: 20px;
      line-height: 1;
    }
    .operational-chrome-actions {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }
    .operational-completed-badge,
    .attachment-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 26px;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .operational-completed-badge {
      background: rgba(72, 199, 116, 0.18);
      color: #9cf0b9;
      border: 1px solid rgba(72, 199, 116, 0.50);
    }
    body.light .operational-completed-badge {
      color: #176f39;
      background: rgba(39, 166, 85, 0.13);
      border-color: rgba(39, 166, 85, 0.38);
    }
    .attachment-badge {
      color: #b9d8ff;
      background: rgba(77, 156, 255, 0.12);
      border: 1px solid rgba(77, 156, 255, 0.38);
    }
    body.light .attachment-badge {
      color: #1d5f9f;
      background: rgba(77, 156, 255, 0.10);
      border-color: rgba(43, 119, 194, 0.35);
    }

    .operational-title {
      padding-right: 2px;
      font-size: clamp(25px, 3.6vw, 42px);
      font-weight: 900;
      line-height: 1.10;
      overflow-wrap: anywhere;
    }
    .operational-subtitle {
      margin-top: 8px;
      color: #aeb3bc;
      font-size: clamp(15px, 2vw, 21px);
      font-weight: 650;
      line-height: 1.35;
    }
    body.light .operational-subtitle { color: #666b74; }
    .operational-body {
      margin-top: 18px;
      font-size: clamp(18px, 2.5vw, 27px);
      font-weight: 650;
      line-height: 1.42;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .operational-big-value {
      margin-top: 18px;
      color: var(--operational-accent);
      font-size: clamp(34px, 6vw, 72px);
      font-weight: 950;
      line-height: 1.02;
      letter-spacing: -0.025em;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .operational-panels {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(10px, 1.5vw, 16px);
      margin-top: 19px;
    }
    .operational-panels.panels-1 { grid-template-columns: minmax(0, 1fr); }
    .operational-panels.panels-3,
    .operational-panels.panels-many {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .operational-panel {
      min-width: 0;
      border: 3px solid var(--operational-accent);
      border-radius: 14px;
      padding: clamp(15px, 2vw, 22px);
      background: rgba(var(--operational-accent-rgb), 0.055);
      text-align: center;
      overflow-wrap: anywhere;
    }
    .operational-panel-label {
      color: var(--operational-accent);
      font-size: clamp(18px, 2.8vw, 31px);
      font-weight: 950;
      line-height: 1.05;
      letter-spacing: 0.035em;
      text-transform: uppercase;
    }
    .operational-panel-value {
      margin-top: 10px;
      font-size: clamp(21px, 3.2vw, 37px);
      font-weight: 900;
      line-height: 1.14;
    }
    .operational-panel-note {
      margin-top: 8px;
      color: #aeb3bc;
      font-size: clamp(14px, 1.8vw, 19px);
      line-height: 1.35;
    }
    body.light .operational-panel-note { color: #666b74; }

    .operational-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
    }
    .operational-list-row {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      font-size: clamp(18px, 2.4vw, 26px);
      font-weight: 650;
      line-height: 1.35;
    }
    .operational-list-marker {
      flex: 0 0 auto;
      color: var(--operational-accent);
      font-size: 1.15em;
      font-weight: 950;
      line-height: 1.15;
    }
    .operational-task-box {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      margin-top: 2px;
      border: 3px solid var(--operational-accent);
      border-radius: 6px;
    }

    .info-corner-icon {
      position: absolute;
      top: 13px;
      right: 14px;
      z-index: 2;
      color: var(--operational-accent);
      font-size: clamp(25px, 3vw, 34px);
      font-weight: 900;
      line-height: 1;
    }
    .operational-info .operational-title,
    .operational-info .operational-chrome {
      padding-right: 34px;
    }
    .alert-corner-icon {
      position: absolute;
      top: 11px;
      z-index: 2;
      color: #ff666b;
      font-size: clamp(24px, 3.1vw, 36px);
      line-height: 1;
      filter: drop-shadow(0 0 8px rgba(255, 79, 85, 0.35));
    }
    .alert-corner-icon.left { left: 13px; }
    .alert-corner-icon.right { right: 13px; }
    .operational-alert .operational-chrome {
      justify-content: center;
      padding-inline: 35px;
    }
    .operational-alert .operational-kind { color: #ff777b; }
    .operational-alert .operational-title { text-align: center; }
    .operational-alert .operational-subtitle { text-align: center; }

    /* Připnutí provozní karty k objednávce. */
    .attached-stack {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 10px 0 0 clamp(18px, 3vw, 34px);
      padding-left: clamp(17px, 2.3vw, 26px);
      border-left: 3px solid rgba(126, 164, 215, 0.52);
    }
    body.light .attached-stack { border-left-color: rgba(61, 102, 156, 0.42); }
    .attached-item {
      position: relative;
      min-width: 0;
      will-change: transform, opacity;
    }
    .attached-item::before {
      content: '';
      position: absolute;
      left: calc(-1 * clamp(17px, 2.3vw, 26px));
      top: 30px;
      width: clamp(14px, 2vw, 23px);
      border-top: 3px solid rgba(126, 164, 215, 0.52);
      transform: translateX(-1px);
    }
    body.light .attached-item::before { border-top-color: rgba(61, 102, 156, 0.42); }
    .attached-item .operational-card {
      padding: clamp(16px, 2.2vw, 24px);
      border-width: 2px;
      border-radius: 14px;
    }
    .attached-item .operational-title {
      font-size: clamp(21px, 3vw, 33px);
    }
    .attached-item .operational-body,
    .attached-item .operational-list-row {
      font-size: clamp(16px, 2.15vw, 23px);
    }
    .attached-item .operational-panel {
      border-width: 2px;
      padding: clamp(12px, 1.7vw, 18px);
    }

    @keyframes alertBorderPulse {
      0%, 100% {
        border-color: rgba(255, 79, 85, 0.88);
        box-shadow: 0 0 0 0 rgba(255, 79, 85, 0.10), inset 0 0 0 1px rgba(255, 79, 85, 0.10);
      }
      50% {
        border-color: #ff8589;
        box-shadow: 0 0 0 7px rgba(255, 79, 85, 0.12), 0 0 28px rgba(255, 79, 85, 0.25), inset 0 0 0 1px rgba(255, 79, 85, 0.24);
      }
    }

    /* =====================================================
       INDIKÁTORY VIDITELNOSTI v14+
       ===================================================== */
    .visibility-indicator-stack {
      position: fixed;
      left: 50%;

    /* =====================================================
       ANIMACE STAVŮ / PŘESUNŮ / ZMIZENÍ
       ===================================================== */
    .display-item {
      will-change: transform, opacity;

    .display-item.state-change-pulse,
    .attached-item.state-change-pulse {

    .op-enter-reminder { animation: reminderEnter 520ms cubic-bezier(0.2, 0.85, 0.2, 1) both; }
    .op-enter-tip { animation: tipEnter 560ms cubic-bezier(0.2, 0.85, 0.2, 1) both; }
    .op-enter-info { animation: infoEnter 460ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }

    @keyframes statePulse {
      0% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }

      55% { box-shadow: 0 0 0 2px rgba(255,255,255,0.10), 0 8px 24px rgba(0,0,0,0.22); }
      100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    }
    @keyframes itemEnter {
      from { opacity: 0; transform: scale(0.965); }
      to { opacity: 1; transform: scale(1); }

    @keyframes itemExit {
      from { opacity: 1; transform: scale(1); filter: blur(0); }

    @keyframes reminderEnter {
      from { opacity: 0; transform: translateY(-12px) scale(0.975); }

    @keyframes tipEnter {

    }
    @keyframes alertEnter {
      0% { opacity: 0; transform: scale(0.94); }
      48% { opacity: 1; transform: scale(1.025); }
      72% { transform: scale(0.992); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes reminderComplete {
      0%, 100% { transform: scale(1); }
      34% { transform: scale(1.025); filter: brightness(1.22); }
      62% { transform: scale(0.992); }
    }
    @keyframes tipComplete {
      0%, 100% { transform: translateY(0) scale(1); }

    }
    @keyframes infoComplete {

    }
    @keyframes alertComplete {

      100% { transform: scale(1); filter: brightness(1); }

    /* =====================================================
       RESPONSIVNÍ ROZLOŽENÍ — orientace + reálná šířka
       JavaScript nastavuje body[data-orientation] a
       body[data-display-size]. Media queries fungují jako
       bezpečný fallback ještě před prvním během skriptu.
       ===================================================== */

    @media (max-width: 900px) {
      .span-8, .span-6, .span-4 { grid-column: span 6; }
      .media-split, .media-split.reverse { grid-template-columns: 1fr; }
      .gallery.three, .gallery.many { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* Vertikální režim: čitelnost má přednost před počtem sloupců. */
    @media (orientation: portrait) {
      .span-12, .span-8, .span-6, .span-4 { grid-column: 1 / -1; }
      .media-split, .media-split.reverse { grid-template-columns: 1fr; }
      .media-split.reverse .media-image-wrapper { order: 0; }
      .media-split.reverse .media-split-text { order: 1; }
      .empty { min-height: 72vh; min-height: 72dvh; }
      .gallery.three, .gallery.many { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* Totéž přes JS profil — okamžitě se přepne i při otočení zařízení. */
    body[data-orientation="portrait"] .span-12,
    body[data-orientation="portrait"] .span-8,
    body[data-orientation="portrait"] .span-6,
    body[data-orientation="portrait"] .span-4 {
      grid-column: 1 / -1;
    }
    body[data-orientation="portrait"] .media-split,
    body[data-orientation="portrait"] .media-split.reverse {
      grid-template-columns: 1fr;
    }
    body[data-orientation="portrait"] .media-split.reverse .media-image-wrapper { order: 0; }
    body[data-orientation="portrait"] .media-split.reverse .media-split-text { order: 1; }

    /* Středně široké landscape displeje (typicky tablet):
       při 3+ objednávkách maximálně dvě vedle sebe, aby text nebyl příliš úzký. */
    body[data-orientation="landscape"][data-display-size="medium"] .type-order.layout-many.span-4 {
      grid-column: span 6;
    }

    /* Nízký landscape viewport: úspornější výška bez ztráty čitelnosti. */
    @media (orientation: landscape) and (max-height: 650px) {
      :root {
        --app-padding: 12px;

    }



    @media (max-width: 920px) {
      .operational-panels.panels-3,
      .operational-panels.panels-many {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (orientation: portrait) and (max-width: 500px) {

    /* Kompaktní zařízení / telefon. */
    @media (max-width: 620px) {

    /* =====================================================
       MANUÁLNÍ OVLÁDÁNÍ KARET v16
       ===================================================== */
    .manual-gesture-card {
      cursor: pointer;

      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      transform: scale(1);
      transition: transform 90ms ease-out, border-color 280ms ease, opacity 280ms ease;
    }
    .manual-gesture-card.card-press-active { transform: scale(0.985); }

    .manual-gesture-target {

    #batteryWarningOverlay {
      position: fixed;
      inset: 0;
      z-index: 2147483646;
      display: grid;
      place-items: center;
      background: transparent;
      pointer-events: auto;

    #batteryWarningOverlay[data-stage="critical"] .battery-warning-symbol { color: #ff414b; }
    #batteryWarningOverlay[data-stage="critical"] { animation-duration: 1000ms; }
    #batteryWarningOverlay[data-stage="critical"] .battery-warning-symbol { animation-duration: 1000ms; }
    body.battery-warning-active #alertViewportPulse,

    @keyframes batterySymbolPulse {
      0%,100% { opacity: 0.42; }

    }
    @keyframes batteryEdgePulse {
      0%,100% { box-shadow: inset 0 0 0 4px rgba(255,65,75,0.30),inset 0 0 26px rgba(255,65,75,0.08); }
      50% { box-shadow: inset 0 0 0 10px rgba(255,65,75,0.88),inset 0 0 54px rgba(255,65,75,0.24); }
    }
    @media (prefers-reduced-motion: reduce) {
      #batteryWarningOverlay { animation: none; box-shadow: inset 0 0 0 6px rgba(255,65,75,0.75); }
      .battery-warning-symbol { animation: none; opacity: 0.75; }
      .manual-swipe-ghost { transition-duration: 1ms !important; }
    }

  </style>
</head>

  <script>
    const DISPLAY_APP_VERSION = '17.0';
    const DEFAULT_SCREEN_TITLE = `Display App v${DISPLAY_APP_VERSION}`;
    const PRAGUE_TIME_ZONE = 'Europe/Prague';
    const CZECH_LOCALE = 'cs-CZ';
    const CONNECTION_FAILURE_THRESHOLD = 3;
    const PRAGUE_CLOCK_FORMATTER = new Intl.DateTimeFormat(CZECH_LOCALE, {
      timeZone: PRAGUE_TIME_ZONE,
      hour: '2-digit',
      minute: '2-digit',
      hourCycle: 'h23'
    });
    const PRAGUE_DATE_FORMATTER = new Intl.DateTimeFormat(CZECH_LOCALE, {
      timeZone: PRAGUE_TIME_ZONE,
      weekday: 'long',
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    });

    let pollTimer = null;
    let latestData = null;
    let lastRenderSignature = '';
    let currentPollSeconds = 3;
    let consecutivePollErrors = 0;
    let connectionErrorActive = false;

    let wakeLockSentinel = null;
    let wakeLockRequestInFlight = false;
    let wakeLockRetryTimer = null;

    const OPERATIONAL_TYPES = new Set(['reminder', 'tip', 'info', 'alert']);
    const ALERT_SIREN_MUTE_STORAGE_KEY = 'displayApp.alertSirenMuted.v1';
    const ALERT_SIREN_MUTED_IDS_STORAGE_KEY = 'displayApp.alertSirenMutedIds.v1';
    const TERMINAL_VISIBILITY_STORAGE_KEY = 'displayApp.terminalVisibilityStarts.v1';
    const ALERT_VIEWPORT_PULSE_MS = 10000;
    const ALERT_AUTO_SCROLL_MS = 360;
    const REMINDER_ALARM_PLAY_MS = 20000;
    const REMINDER_ALARM_PAUSE_MS = 40000;
    const REMINDER_VIEWPORT_PULSE_MS = 10000;
    const REMINDER_AUTO_SCROLL_MS = 360;
    const ORDER_LONG_PRESS_MS = 620;
    const GESTURE_MOVE_TOLERANCE_PX = 11;
    const SWIPE_START_PX = 14;
    const SWIPE_THRESHOLD_RATIO = 0.28;
    const SWIPE_MIN_THRESHOLD_PX = 92;
    const VISIBILITY_INDICATOR_FADE_MS = 150;
    const VISIBILITY_INDICATOR_EDGE_GAP = 10;
    const VISIBILITY_INDICATOR_COLLISION_PADDING = 6;

    let audioContext = null;
    let audioUnlocked = false;
    let soundEnabled = false;
    let soundVolume = 1;
    let pendingSounds = [];
    let soundStateInitialized = false;
    let previousSoundStates = new Map();

    let alertSirenMuted = readStoredAlertSirenMuted();
    let alertSirenMutedAlertIds = readStoredAlertSirenMutedAlertIds();
    let alertSirenWanted = false;
    let alertSirenPhase = 'idle';
    let alertSirenTimer = null;
    let alertSirenNodes = [];
    let alertSirenCycleToken = 0;
    let alertViewportPulseTimer = null;
    let alertAutoScrollFrame = null;

    let reminderAlarmWanted = false;
    let reminderAlarmPhase = 'idle';
    let reminderAlarmTimer = null;
    let reminderAlarmNodes = [];
    let reminderAlarmCycleToken = 0;
    let reminderAlarmPhaseEndsAt = 0;
    let reminderViewportPulseTimer = null;
    let reminderDueTimer = null;
    let reminderStateInitialized = false;
    let previousRingingReminderIds = new Set();

    let activeOrderDetailItem = null;
    let orderDetailSubmitting = false;
    let displayActionToastTimer = null;
    const manualActionInFlight = new Set();

    let terminalVisibilityStarts = readStoredTerminalVisibilityStarts();
    let terminalVisibilityStateInitialized = false;
    let previousTerminalObservationStatuses = new Map();

    let visibilityIndicatorUpdateFrame = null;
    let visibilityIndicatorSettleTimer = null;
    const visibilityIndicatorHideTimers = new Map();
    let visibilityIndicatorResizeObserver = null;

    const timedOperationalRegistry = new Map();
    const timedExpiryHandledIds = new Set();

    const MOVE_ANIMATION_MS = 430;
    const EXIT_ANIMATION_MS = 380;
    const TERMINAL_REORDER_HOLD_MS = 1000;

    let visualStateInitialized = false;
    let previousVisualItemStatuses = new Map();
    let renderedItemStatuses = new Map();
    let renderedItemIds = new Set();
    let reorderHolds = new Map();
    let reorderHoldTimers = new Map();
    let removalInProgress = new Set();

    /* V16.5: server snapshot and temporary visual projections are separate.
       Nothing below writes the archive or invents a confirmed timestamp. */
    let authoritativeData = null;
    let manualRequestActive = null;
    let manualRequestSequence = 0;
    let displayReadEpoch = 0;
    let displayPollInFlight = false;
    const pendingManualActions = new Map();
    const manualActionQueue = [];
    const manualGestureCancellers = new Set();
    const MANUAL_REQUEST_TIMEOUT_MS = 30000;

    function cloneDisplayValue(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function scheduleDisplayPoll(delayMs = currentPollSeconds * 1000) {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(refreshDisplay, Math.max(0, delayMs));
    }

    // Same-origin Cloudflare transport. A failed POST is NEVER retried here.
    async function displayApiRequest(path, { method = 'GET', body, timeoutMs = 12000 } = {}) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(path, {
          method, cache: 'no-store', signal: controller.signal,
          headers: body === undefined ? { Accept: 'application/json' } : {
            Accept: 'application/json', 'Content-Type': 'application/json'
          },
          body: body === undefined ? undefined : JSON.stringify(body)
        });
        const result = await response.json();
        // A 409 carries the authoritative snapshot needed to roll back a preview.
        if (!response.ok && !(method === 'POST' && result && result.ok === false)) {
          throw new Error(result.message || `HTTP ${response.status}`);
        }
        return result;
      } finally { clearTimeout(timeout); }
    }

    function refreshDisplay() {
      clearTimeout(pollTimer);
      // Do not overlap a snapshot poll with an in-flight manual write.
      if (manualRequestActive || manualActionQueue.length || displayPollInFlight) {
        scheduleDisplayPoll();
        return;
      }
      displayPollInFlight = true;
      const epoch = displayReadEpoch;
      displayApiRequest('/api/display', { timeoutMs: 12000 })
        .then(data => {
          displayPollInFlight = false;
          if (epoch !== displayReadEpoch) { scheduleDisplayPoll(); return; }
          handleData(data);
        })
        .catch(error => {
          displayPollInFlight = false;
          if (epoch !== displayReadEpoch) { scheduleDisplayPoll(); return; }
          handleError(error);
        });
    }

    function handleData(data) {
      if (!data || !Array.isArray(data.items)) {
        handleError(new Error('Neplatná odpověď displeje.'));
        return;
      }
      authoritativeData = cloneDisplayValue(data);
      consecutivePollErrors = 0;
      setConnectionErrorState(false);
      renderCurrentDisplayState();
      scheduleDisplayPoll();
    }

    function getProjectedDisplayItems() {
      const byId = new Map();
      const base = authoritativeData && Array.isArray(authoritativeData.items) ? authoritativeData.items : [];
      base.forEach(item => byId.set(String(item.id || ''), cloneDisplayValue(item)));
      pendingManualActions.forEach(operation => {
        operation.patches.forEach((item, id) => {
          if (item === null) byId.delete(id);
          else byId.set(id, cloneDisplayValue(item));
        });
      });
      return Array.from(byId.values());
    }

    function isPendingVisualItem(id) {
      const value = String(id || '');
      for (const operation of pendingManualActions.values()) {
        if (operation.affectedIds.has(value)) return true;
      }
      return false;
    }

    function markPendingManualCards() {
      document.querySelectorAll('#content [data-item-id]').forEach(wrapper => {
        const busy = manualActionInFlight.has(String(wrapper.dataset.itemId || ''));
        const card = wrapper.matches('.card') ? wrapper : wrapper.querySelector('.card');
        if (card) {
          card.classList.toggle('action-pending', busy);
          if (busy) card.setAttribute('aria-busy', 'true');
          else card.removeAttribute('aria-busy');
        }
      });
    }

    function cancelActiveManualGestures() {
      Array.from(manualGestureCancellers).forEach(cancel => cancel());
      manualGestureCancellers.clear();
    }

    function localOrderItemText(value) {
      return String(typeof value === 'string' ? value :
        (value && (value.text || value.title || value.name)) || '').trim();
    }

    function localAllOrderItems(item, data) {
      const values = String(item.body || '').split('\n').map(stripOrderLineQuantityForSelection);
      if (Array.isArray(data.pending_items)) values.push(...data.pending_items);
      if (Array.isArray(data.served_items)) values.push(...data.served_items);
      const byKey = new Map();
      values.forEach(value => {
        const text = localOrderItemText(value);
        const key = normalizeOrderSelectionKey(text);
        if (key && !byKey.has(key)) byKey.set(key, text);
      });
      return Array.from(byKey.values());
    }

    function localPendingOrderItems(item, data) {
      if (Array.isArray(data.pending_items)) return data.pending_items.map(localOrderItemText).filter(Boolean);
      if (Array.isArray(data.items)) {
        const values = data.items.filter(value => !value || typeof value !== 'object' ||
          (!isCompletedStatus(value.status) && String(value.status || '') !== 'served'))
          .map(localOrderItemText).filter(Boolean);
        if (values.length) return values;
      }
      return String(item.body || '').split('\n').map(stripOrderLineQuantityForSelection).filter(Boolean);
    }

    function localServedOrderItems(data) {
      if (Array.isArray(data.served_items)) return data.served_items.map(localOrderItemText).filter(Boolean);
      return Array.isArray(data.items) ? data.items.filter(value => value && typeof value === 'object' &&
        (isCompletedStatus(value.status) || String(value.status || '') === 'served'))
        .map(localOrderItemText).filter(Boolean) : [];
    }

    function makeManualProjection(action, original, extra, allItems) {
      const item = cloneDisplayValue(original);
      const data = parseDataJson(item.data_json);
      const patches = new Map();
      const id = String(item.id || '');
      const children = allItems.filter(child => isOperationalType(child.type) && getParentOrderId(child) === id);
      const put = (value, valueData) => {
        if (valueData) value.data_json = JSON.stringify(valueData);
        patches.set(String(value.id || ''), value);
      };
      const complete = (orderData, undoSnapshot) => {
        orderData.served_items = Array.from(new Set(localServedOrderItems(orderData).concat(localPendingOrderItems(item, orderData))));
        orderData.pending_items = [];
        orderData._completion_undo = undoSnapshot;
        item.status = 'served';
        children.forEach(child => {
          if (getOperationalStatus(child.status) === 'completed') return;
          const next = cloneDisplayValue(child);
          const childData = parseDataJson(next.data_json);
          next.status = 'completed';
          childData.completed_by_parent = true;
          // No authoritative date is generated on the device.
          put(next, childData);
          undoSnapshot.completed_child_ids.push(String(child.id));
        });
        put(item, orderData);
      };
      const snapshot = () => {
        const clean = cloneDisplayValue(data);
        delete clean._completion_undo;
        return {
          order: { status: item.status || 'waiting', data_json: JSON.stringify(clean) },
          children: children.map(child => ({ id: String(child.id), status: child.status, data_json: child.data_json })),
          completed_child_ids: []
        };
      };

      if (action === 'swipe_item') {
        patches.set(id, null);
        if (canonicalType(item.type) === 'order') children.forEach(child => patches.set(String(child.id), null));
      } else if (action === 'complete_reminder') {
        item.status = 'completed';
        delete data.completed_by_parent;
        put(item, data);
      } else if (action === 'toggle_order_completion') {
        if (getMainOrderStatus(item.status) === 'waiting') {
          complete(data, snapshot());
        } else if (getMainOrderStatus(item.status) === 'completed') {
          const undo = data._completion_undo;
          let restored;
          if (undo && undo.order) {
            restored = parseDataJson(undo.order.data_json);
            item.status = String(undo.order.status || 'waiting');
            const childIds = new Set((undo.completed_child_ids || []).map(String));
            (undo.children || []).forEach(saved => {
              const child = children.find(value => String(value.id) === String(saved.id));
              if (!child || !childIds.has(String(saved.id)) || !parseDataJson(child.data_json).completed_by_parent) return;
              put(Object.assign({}, cloneDisplayValue(child), { status: saved.status || 'active', data_json: saved.data_json }));
            });
          } else {
            restored = cloneDisplayValue(data);
            restored.served_items = [];
            restored.pending_items = localAllOrderItems(item, restored);
            item.status = 'waiting';
          }
          ['served_at', 'completed_at', 'cancelled_at', 'canceled_at', '_completion_undo'].forEach(key => delete restored[key]);
          put(item, restored);
        }
      } else if (action === 'set_order_item_states') {
        const undo = snapshot();
        const keys = new Set((extra.served_items || []).map(normalizeOrderSelectionKey));
        const values = localAllOrderItems(item, data);
        data.served_items = values.filter(value => keys.has(normalizeOrderSelectionKey(value)));
        data.pending_items = values.filter(value => !keys.has(normalizeOrderSelectionKey(value)));
        if (values.length && !data.pending_items.length) complete(data, undo);
        else put(item, data);
      } else {
        throw new Error('Nepodporovaný lokální náhled: ' + action);
      }
      return patches;
    }

    function sendDisplayAction(action, item, extra = {}) {
      const itemId = String(item && item.id || '');
      if (!itemId || !authoritativeData || manualActionInFlight.has(itemId)) return Promise.resolve({ ok: false, busy: true });
      const currentItems = latestData && Array.isArray(latestData.items) ? latestData.items : [];
      const actual = currentItems.find(value => String(value.id) === itemId);
      // Ignore obsolete DOM closures rather than send a toggle against a new row.
      if (!actual || String(actual.updated_at || '') !== String(item.updated_at || '') || actual.status !== item.status) {
        showDisplayActionToast('Karta se mezitím změnila. Zkuste ji znovu.');
        return Promise.resolve({ ok: false, conflict: true });
      }
      let patches;
      try { patches = makeManualProjection(action, actual, extra, currentItems); }
      catch (error) {
        console.error(error);
        showDisplayActionToast('Změnu se nepodařilo připravit.');
        return Promise.resolve({ ok: false });
      }
      const lockIds = new Set(patches.keys());
      lockIds.add(itemId);
      const parentId = getParentOrderId(actual);
      if (parentId) lockIds.add(parentId);
      if (Array.from(lockIds).some(id => manualActionInFlight.has(id))) return Promise.resolve({ ok: false, busy: true });
      const sequence = ++manualRequestSequence;
      const request = Object.assign({}, extra, {
        action, item_id: itemId,
        expected_updated_at: String(actual.updated_at || ''), expected_status: String(actual.status || '')
      });
      return new Promise(resolve => {
        const operation = { sequence, itemId, action, request, patches, lockIds, affectedIds: new Set(patches.keys()), resolve, settled: false };
        pendingManualActions.set(sequence, operation);
        lockIds.forEach(id => manualActionInFlight.add(id));
        manualActionQueue.push(operation);
        // Invalidate every read that started before this action.
        displayReadEpoch += 1;
        clearTimeout(pollTimer);
        cancelActiveManualGestures();
        renderCurrentDisplayState();
        if (action !== 'swipe_item') {
          document.querySelectorAll('#content [data-item-id]').forEach(wrapper => {
            if (String(wrapper.dataset.itemId) === itemId) {
              const card = wrapper.matches('.card') ? wrapper : wrapper.querySelector('.card');
              if (card) triggerCardPressEffect(card);
            }
          });
        }
        pumpManualActionQueue();
      });
    }

    function pumpManualActionQueue() {
      if (manualRequestActive || !manualActionQueue.length) return;
      const operation = manualActionQueue.shift();
      manualRequestActive = operation;
      operation.timeout = setTimeout(() => {
        finishManualAction(operation, { ok: false, uncertain: true,
          message: 'Server zatím změnu nepotvrdil. Obnovuji stav; příkaz neopakuji.' });
      }, MANUAL_REQUEST_TIMEOUT_MS);
      try {
        displayApiRequest('/api/action', {
          method: 'POST', body: operation.request, timeoutMs: MANUAL_REQUEST_TIMEOUT_MS
        })
          .then(response => {
            if (operation.settled) { scheduleDisplayPoll(0); return; }
            finishManualAction(operation, response || { ok: false, message: 'Prázdná odpověď serveru.' });
          })
          .catch(error => {
            console.error(error);
            if (operation.settled) { scheduleDisplayPoll(0); return; }
            finishManualAction(operation, { ok: false, uncertain: true,
              message: 'Potvrzení se nepodařilo načíst. Obnovuji skutečný stav ze serveru.' });
          });
      } catch (error) {
        finishManualAction(operation, { ok: false, message: 'Změnu se nepodařilo odeslat.' });
      }
    }

    function finishManualAction(operation, response) {
      if (operation.settled) return;
      operation.settled = true;
      clearTimeout(operation.timeout);
      displayReadEpoch += 1;
      pendingManualActions.delete(operation.sequence);
      operation.lockIds.forEach(id => manualActionInFlight.delete(id));
      if (manualRequestActive === operation) manualRequestActive = null;

      const hasSnapshot = response.data && Array.isArray(response.data.items);
      if (hasSnapshot) authoritativeData = cloneDisplayValue(response.data);
      // Skip duplicate completion / modified sounds when a preview gets confirmed.
      // Do not treat a restored, muted alert after rejection as a NEW alert.
      const projected = getProjectedDisplayItems();
      const states = buildSoundStateSnapshot(projected, buildDisplayContext(projected));
      operation.affectedIds.forEach(id => {
        if (states.has(id)) previousSoundStates.set(id, states.get(id));
        else previousSoundStates.delete(id);
      });

      if (response.ok && hasSnapshot) {
        const now = Date.now();
        const context = buildDisplayContext(authoritativeData.items);
        operation.affectedIds.forEach(id => {
          const confirmed = context.itemById.get(id);
          if (!confirmed) return;
          const status = getEffectiveDisplayStatus(confirmed, context);
          const previous = previousTerminalObservationStatuses.get(id);
          if (shouldAutoHideItem(confirmed, status) &&
              (!previous || !shouldAutoHideItem(previous.item, previous.status) || previous.status !== status)) {
            terminalVisibilityStarts.set(id, now);
          }
        });
        persistTerminalVisibilityStarts();
      }
      // A failure without a snapshot rolls back to the LAST CONFIRMED state, then
      // performs a fresh read. A lost reply is not proof that a write failed.
      renderCurrentDisplayState();
      if (!response.ok) showDisplayActionToast(response.message || 'Změnu server odmítl. Stav byl obnoven.');
      operation.resolve(response);
      if (manualActionQueue.length) pumpManualActionQueue();
      else scheduleDisplayPoll(response.ok && hasSnapshot ? currentPollSeconds * 1000 : 0);
    }

    function animateManualSwipeGhost(target, direction) {
      const rect = target.getBoundingClientRect();
      const ghost = target.cloneNode(true);
      ghost.removeAttribute('id');
      ghost.removeAttribute('data-item-id');
      ghost.querySelectorAll('[id], [data-item-id]').forEach(node => {
        node.removeAttribute('id'); node.removeAttribute('data-item-id');
      });
      [ghost, ...ghost.querySelectorAll('[data-hide-at], [data-timed-expire-at], [data-timer-start]')].forEach(node => {
        node.removeAttribute('data-hide-at'); node.removeAttribute('data-timed-expire-at'); node.removeAttribute('data-timer-start');
      });
      ghost.className = target.className + ' manual-swipe-ghost';
      ghost.classList.remove('swipe-active', 'swipe-returning');
      ghost.setAttribute('aria-hidden', 'true');
      ghost.style.cssText = `position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px;margin:0;pointer-events:none;z-index:1200;transform:none;opacity:0.8;transition:transform 220ms ease-out,opacity 200ms ease-out;`;
      document.body.appendChild(ghost);
      requestAnimationFrame(() => {
        ghost.style.transform = `translateX(${direction * (window.innerWidth + rect.width)}px)`;
        ghost.style.opacity = '0';
      });
      setTimeout(() => ghost.remove(), 260);
    }

    function renderCurrentDisplayState() {
      if (!authoritativeData) return;
      latestData = { ...authoritativeData, items: getProjectedDisplayItems() };
      const settings = latestData.settings || {};
      const serverItems = Array.isArray(latestData.items) ? latestData.items : [];
      const rawItems = reconcileTimedOperationalItems(serverItems);
      latestData.items = rawItems;
      synchronizeOpenOrderDetail(rawItems);
      const displayContext = buildDisplayContext(rawItems);

      applyTheme(settings.theme || 'dark');

      // Observe ONLY confirmed server data. Previewed completions have no timer.
      const confirmedItems = authoritativeData.items || [];
      synchronizeTerminalVisibilityState(confirmedItems, settings, buildDisplayContext(confirmedItems));
      trackVisualTransitions(rawItems, displayContext);
      const reminderResult = synchronizeReminderSchedule(rawItems, displayContext);
      configureSound(settings);
      const soundResult = processDisplaySoundEvents(rawItems, displayContext);
      updateAlertSirenState(rawItems, displayContext, {
        startDelayMs: 0,
        restartCycle: soundResult.newAlertAdded
      });
      updateReminderAlarmState(rawItems, displayContext, {
        restartCycle: reminderResult.newlyRingingIds.length > 0
      });

      const visibleItems = prepareVisibleItems(rawItems, settings, displayContext);
      const visibleItemIds = new Set(visibleItems.map(item => String(item && item.id || '')).filter(Boolean));
      const newVisibleAlertIds = (soundResult.newAlertIds || []).filter(id => visibleItemIds.has(String(id)));
      if (newVisibleAlertIds.length) triggerAlertViewportPulse();
      if (reminderResult.newlyRingingIds.length) triggerReminderViewportPulse();

      const dynamicTitle = updateDynamicScreenTitle(visibleItems);
      const signature = JSON.stringify({
        theme: settings.theme,
        title: dynamicTitle,
        items: visibleItems,
        ringingReminders: getRingingReminderIds(rawItems, displayContext)
      });

      let contentWasRendered = false;
      if (signature !== lastRenderSignature) {
        renderPreparedItems(visibleItems, settings);
        lastRenderSignature = signature;
        contentWasRendered = true;
      } else {
        updateConnectionPresentation();
        updateClockDisplays();
      }

      // Pokud vzniknou oba typy současně, nouzové Upozornění má vždy
      // přednost i pro automatický scroll.
      if (newVisibleAlertIds.length) scheduleNewAlertAutoScroll(newVisibleAlertIds);
      else if (reminderResult.newlyRingingIds.length) scheduleNewReminderAutoScroll(reminderResult.newlyRingingIds);
      scheduleVisibilityIndicatorUpdate({ settle: contentWasRendered });

      currentPollSeconds = clampNumber(settings.poll_seconds, 3, 2, 60);
      markPendingManualCards();
    }

    function handleError(error) {
      console.error(error);
      consecutivePollErrors += 1;

      if (consecutivePollErrors >= CONNECTION_FAILURE_THRESHOLD) {
        setConnectionErrorState(true);
      }

      // Ponech poslední známý obsah beze změny a pouze zkus připojení znovu.
      clearTimeout(pollTimer);
      pollTimer = setTimeout(refreshDisplay, currentPollSeconds * 1000);
    }

    function buildDisplayContext(items) {
      const orderById = new Map();
      const itemById = new Map();
      const parentByChildId = new Map();
      const declaredParentByChildId = new Map();
      const childrenByOrderId = new Map();

      items.forEach(item => {
        const id = String(item && item.id || '');
        if (!id) return;
        itemById.set(id, item);
        if (canonicalType(item.type) === 'order') orderById.set(id, item);
      });

      items.forEach(item => {
        const id = String(item && item.id || '');
        if (!id || !isOperationalType(item.type)) return;

        const parentId = getParentOrderId(item);
        if (!parentId) return;
        declaredParentByChildId.set(id, parentId);
        if (!orderById.has(parentId)) return;

        parentByChildId.set(id, parentId);
        if (!childrenByOrderId.has(parentId)) childrenByOrderId.set(parentId, []);
        childrenByOrderId.get(parentId).push(item);
      });

      return { orderById, itemById, parentByChildId, declaredParentByChildId, childrenByOrderId };
    }

    function prepareVisibleItems(items, settings, suppliedContext = null) {
      const context = suppliedContext || buildDisplayContext(items);
      const completedSeconds = clampNumber(settings.completed_visibility_seconds, 60, 0, 3600);
      const visibleOrderIds = new Set();
      const visible = [];

      items.forEach(item => {
        if (canonicalType(item.type) !== 'order') return;
        if (!isItemExpiredForDisplay(item, getMainOrderStatus(item.status), completedSeconds, null)) {
          const id = String(item.id || '');
          if (id) visibleOrderIds.add(id);
          visible.push(item);
        }
      });

      items.forEach(item => {
        const type = canonicalType(item.type);
        if (type === 'order') return;
        const id = String(item.id || '');

        if (type === 'checklist') {
          const status = normalizeStatus(item.status);
          if (isCompletedStatus(status)) return;
          if (getChecklistTasks(item).length === 0) return;
        }

        const declaredParentId = id ? context.declaredParentByChildId.get(id) : '';
        if (declaredParentId && !context.orderById.has(declaredParentId)) {
          // Podřízená karta se při chybějícím rodiči nesmí sama znovu
          // objevit jako samostatná karta.
          return;
        }

        const parentId = id ? context.parentByChildId.get(id) : '';
        if (parentId) {
          // Připnutá karta nikdy nepřeskočí do samostatné sekce jen proto,
          // že její rodič už není viditelný.
          if (!visibleOrderIds.has(parentId)) return;

          const parent = context.orderById.get(parentId);
          const parentStatus = parent ? getMainOrderStatus(parent.status) : 'waiting';

          if (isTerminalOrderStatus(parentStatus)) {
            // Aktivní dítě dokončí rodič a zůstane s ním. Kartu, která byla
            // samostatně dokončena a už dříve odanimována, ale nevzkřísíme.
            const ownStatus = getOperationalStatus(item.status);
            if (ownStatus === 'completed' && isItemExpiredForDisplay(item, ownStatus, completedSeconds, null)) return;
            visible.push(item);
            return;
          }

          const childStatus = getEffectiveDisplayStatus(item, context);
          if (!isTimedOperationalItemExpiredForDisplay(item, childStatus) &&
              !isItemExpiredForDisplay(item, childStatus, completedSeconds, null)) {
            visible.push(item);
          }
          return;
        }

        const displayStatus = getEffectiveDisplayStatus(item, context);
        if (!isTimedOperationalItemExpiredForDisplay(item, displayStatus) &&
            !isItemExpiredForDisplay(item, displayStatus, completedSeconds, null)) {
          visible.push(item);
        }
      });

      return visible;
    }

    function isItemExpiredForDisplay(item, displayStatus, completedSeconds, completionTimestampOverride) {
      if (!shouldAutoHideItem(item, displayStatus)) return false;

      const completedAt = completionTimestampOverride || getTerminalVisibilityStartTimestamp(item);
      if (!completedAt || Date.now() - completedAt < completedSeconds * 1000) return false;

      const id = String(item.id || '');
      // Položka, která už je vykreslená, zůstane v datovém modelu ještě tak
      // dlouho, aby ji mohl lokálně odstranit plynulý exit efekt.
      return !id || !renderedItemIds.has(id);
    }

    function buildDisplayEntries(items, suppliedContext = null) {
      const context = suppliedContext || buildDisplayContext(items);
      const visibleIds = new Set(items.map(item => String(item.id || '')).filter(Boolean));
      const entries = [];

      items.forEach((item, index) => {
        const type = canonicalType(item.type);
        const id = String(item.id || '');

        if (type === 'order') {
          const children = (context.childrenByOrderId.get(id) || [])
            .filter(child => visibleIds.has(String(child.id || '')) && !isRingingReminder(child, context))
            .sort(compareNewestFirst);

          entries.push({ kind: 'order-group', item, children, index });
          return;
        }

        if (id && context.declaredParentByChildId.has(id) && !isRingingReminder(item, context)) return;
        entries.push({ kind: 'item', item, children: [], index });
      });

      return entries;
    }

    function renderPreparedItems(items, settings) {
      const content = document.getElementById('content');
      const oldRects = captureItemRects();
      const oldStatuses = new Map(renderedItemStatuses);
      const oldIds = new Set(renderedItemIds);
      const context = buildDisplayContext(items);
      const entries = sortEntriesForDisplay(buildDisplayEntries(items, context), context);

      content.innerHTML = '';

      if (!entries.length) {
        renderedItemStatuses = new Map();
        renderedItemIds = new Set();
        renderEmptyState();
        return;
      }

      const nextStatuses = new Map();
      const nextIds = new Set();

      const tiers = new Map();
      entries.forEach(entry => {
        const rank = getDisplayRank(entry.item, context);
        if (!tiers.has(rank)) tiers.set(rank, []);
        tiers.get(rank).push(entry);
      });

      Array.from(tiers.keys()).sort((a, b) => a - b).forEach(rank => {
        const tierEntries = tiers.get(rank) || [];
        const tier = document.createElement('section');
        tier.className = 'display-tier tier-' + rank;

        tierEntries.forEach((entry, index) => {
          const item = entry.item;
          const id = String(item.id || '');
          const displayStatus = getEffectiveDisplayStatus(item, context);
          let element;

          if (entry.kind === 'order-group') {
            element = createOrderGroup(entry, settings, context, oldStatuses, oldIds, nextStatuses, nextIds);
          } else if (isOperationalType(item.type)) {
            element = createStandaloneOperationalEntry(item, displayStatus, oldStatuses, oldIds, context);
            registerRenderedItem(item, displayStatus, nextStatuses, nextIds);
            applyCompletionHideTime(element, item, settings, displayStatus);
            applyTimedOperationalExpiry(element, item, displayStatus);
          } else {
            element = createDisplayItem(item, { displayStatus });
            applyItemTransitionClasses(element, item, oldStatuses.get(id), displayStatus, !oldIds.has(id));
            registerRenderedItem(item, displayStatus, nextStatuses, nextIds);
            applyCompletionHideTime(element, item, settings, displayStatus);
          }

          if (id) element.dataset.itemId = id;
          applyAutomaticLayout(
            element,
            item,
            index,
            tierEntries.map(value => value.item),
            { entry, tierEntries }
          );

          if (id && !oldRects.has(id) && !isOperationalType(item.type)) {
            element.classList.add('item-enter');
          }

          tier.appendChild(element);
        });

        content.appendChild(tier);
      });

      renderedItemStatuses = nextStatuses;
      renderedItemIds = nextIds;

      updateConnectionPresentation();
      updateClockDisplays();
      requestAnimationFrame(() => animateItemsFromRects(oldRects));
      markPendingManualCards();
      scheduleVisibilityIndicatorUpdate({ settle: true });
    }

    function createOrderGroup(entry, settings, context, oldStatuses, oldIds, nextStatuses, nextIds) {
      const order = entry.item;
      const orderId = String(order.id || '');
      const orderStatus = getEffectiveDisplayStatus(order, context);
      const group = document.createElement('section');
      group.className = 'order-group';
      if (entry.children.length) group.classList.add('has-attached-items');

      const previousOrderStatus = oldStatuses.get(orderId);
      const orderCard = createDisplayItem(order, { displayStatus: orderStatus });
      prepareOrderBorderTransition(orderCard, previousOrderStatus, orderStatus);
      applyItemTransitionClasses(group, order, previousOrderStatus, orderStatus, !oldIds.has(orderId));
      group.appendChild(orderCard);
      registerRenderedItem(order, orderStatus, nextStatuses, nextIds);
      applyCompletionHideTime(group, order, settings, orderStatus);

      if (entry.children.length) {
        const stack = document.createElement('div');
        stack.className = 'attached-stack';
        const parentTerminal = isTerminalOrderStatus(orderStatus);

        entry.children.forEach(child => {
          const childId = String(child.id || '');
          const childStatus = getEffectiveDisplayStatus(child, context);
          const wrapper = document.createElement('div');
          wrapper.className = 'attached-item';
          if (childId) wrapper.dataset.itemId = childId;

          const childCard = createOperationalCard(child, {
            displayStatus: childStatus,
            attached: true,
            parentOrder: order
          });

          wrapper.appendChild(childCard);
          configureManualCardGestures(wrapper, childCard, child, {
            displayStatus: childStatus,
            kind: 'operational'
          });
          applyItemTransitionClasses(wrapper, child, oldStatuses.get(childId), childStatus, !oldIds.has(childId));
          registerRenderedItem(child, childStatus, nextStatuses, nextIds);

          // Jakmile je rodič terminální, celou skupinu řídí jediný časovač
          // rodičovské objednávky. Jinak lze dítě dokončit samostatně.
          if (!parentTerminal) {
            applyCompletionHideTime(wrapper, child, settings, childStatus);
            applyTimedOperationalExpiry(wrapper, child, childStatus);
          }
          stack.appendChild(wrapper);
        });

        group.appendChild(stack);
      }

      configureManualCardGestures(group, orderCard, order, {
        displayStatus: orderStatus,
        kind: 'order'
      });
      return group;
    }

    function prepareOrderBorderTransition(card, previousStatus, currentStatus) {
      if (!card || !previousStatus || previousStatus === currentStatus) return;
      if (!isTerminalOrderStatus(previousStatus) && previousStatus !== 'waiting') return;
      if (!isTerminalOrderStatus(currentStatus) && currentStatus !== 'waiting') return;

      card.classList.remove('waiting', 'completed', 'cancelled');
      card.classList.add(previousStatus);

      requestAnimationFrame(() => {
        if (!card.isConnected) return;
        card.classList.remove('waiting', 'completed', 'cancelled');
        card.classList.add(currentStatus);
      });
    }

    function createStandaloneOperationalEntry(item, displayStatus, oldStatuses, oldIds, context) {
      const id = String(item.id || '');
      const wrapper = document.createElement('section');
      wrapper.className = 'operational-entry';
      const parentId = context && id ? context.parentByChildId.get(id) : '';
      const parentOrder = parentId && context ? context.orderById.get(parentId) : null;
      const promotedReminder = canonicalType(item.type) === 'reminder' && isRingingReminder(item, context) && Boolean(parentOrder);
      const card = createOperationalCard(item, {
        displayStatus,
        attached: promotedReminder,
        parentOrder
      });
      wrapper.appendChild(card);
      configureManualCardGestures(wrapper, card, item, {
        displayStatus,
        kind: 'operational'
      });
      applyItemTransitionClasses(wrapper, item, oldStatuses.get(id), displayStatus, !oldIds.has(id));
      return wrapper;
    }

    function registerRenderedItem(item, status, statusMap, idSet) {
      const id = String(item.id || '');
      if (!id) return;
      statusMap.set(id, status);
      idSet.add(id);
    }

    function applyItemTransitionClasses(element, item, previousStatus, currentStatus, isNew) {
      const type = canonicalType(item.type);

      if (isOperationalType(type)) {
        if (isNew) element.classList.add('op-enter-' + type);
        if (previousStatus && previousStatus !== currentStatus && currentStatus === 'completed') {
          element.classList.add('op-complete-' + type);
        } else if (previousStatus && previousStatus !== currentStatus) {
          element.classList.add('state-change-pulse');
        }
        return;
      }

      if (previousStatus && previousStatus !== currentStatus) {
        element.classList.add('state-change-pulse');
      }
    }

    function getEffectiveDisplayStatus(item, suppliedContext = null) {
      const type = canonicalType(item.type);
      if (type === 'order') return getMainOrderStatus(item.status);

      if (isOperationalType(type)) {
        const context = suppliedContext;
        const id = String(item.id || '');
        const parentId = context && id ? context.parentByChildId.get(id) : '';
        if (parentId && context.orderById.has(parentId)) {
          const parentStatus = getMainOrderStatus(context.orderById.get(parentId).status);
          if (isTerminalOrderStatus(parentStatus)) return 'completed';
        }
        return getOperationalStatus(item.status);
      }

      return normalizeStatus(item.status);
    }

    function sortEntriesForDisplay(entries, context) {
      return entries.slice().sort((a, b) => {
        const rankA = getDisplayRank(a.item, context);
        const rankB = getDisplayRank(b.item, context);
        if (rankA !== rankB) return rankA - rankB;

        // Nouzová upozornění, běžné provozní karty a dokončené provozní
        // karty řadíme od nejnovější. Objednávky zachovávají backendové pořadí.
        if ([0, 1, 3, 6].includes(rankA)) {
          const timeA = getRelevantSortTimestamp(a.item, rankA);
          const timeB = getRelevantSortTimestamp(b.item, rankB);
          if (timeA !== timeB) return timeB - timeA;
        }

        return a.index - b.index;
      });
    }

    function getDisplayRank(item, context, statusOverride = '') {
      const type = canonicalType(item.type);
      const status = statusOverride || getEffectiveDisplayStatus(item, context);
      const id = String(item.id || '');
      const hold = id ? reorderHolds.get(id) : null;
      if (hold && Date.now() < hold.until) return hold.rank;

      if (type === 'alert' && status !== 'completed') return 0;
      if (type === 'reminder' && status !== 'completed' && isRingingReminder(item, context)) return 1;
      if (type === 'order' && status === 'waiting') return 2;
      if (type !== 'order' && status !== 'completed' && !isCancelledStatus(status)) return 3;
      if (type === 'order' && status === 'completed') return 4;
      if (type === 'order' && status === 'cancelled') return 5;
      return 6;
    }

    function getRankForTypeAndStatus(item, status, context) {
      const id = String(item.id || '');
      const hold = id ? reorderHolds.get(id) : null;
      if (hold && Date.now() < hold.until) return hold.rank;
      return getDisplayRank(item, context, status);
    }

    function getRelevantSortTimestamp(item, rank) {
      if (rank === 6) return getCompletionTimestamp(item) || getCreatedTimestamp(item);
      return getCreatedTimestamp(item);
    }

    function getCreatedTimestamp(item) {
      const date = new Date(item.created_at || item.updated_at || 0);
      return isNaN(date.getTime()) ? 0 : date.getTime();
    }

    function compareNewestFirst(a, b) {
      return getCreatedTimestamp(b) - getCreatedTimestamp(a);
    }

    function captureItemRects(excludedId = '') {
      const rects = new Map();
      document.querySelectorAll('.display-item[data-item-id]').forEach(element => {
        const id = String(element.dataset.itemId || '');
        if (!id || id === excludedId || element.classList.contains('item-exit')) return;
        rects.set(id, element.getBoundingClientRect());
      });
      return rects;
    }

    function animateItemsFromRects(oldRects) {
      const moved = [];

      document.querySelectorAll('.display-item[data-item-id]').forEach(element => {
        const id = String(element.dataset.itemId || '');
        const oldRect = oldRects.get(id);
        if (!oldRect || element.classList.contains('item-exit')) return;

        const newRect = element.getBoundingClientRect();
        const deltaX = oldRect.left - newRect.left;
        const deltaY = oldRect.top - newRect.top;

        if (Math.abs(deltaX) < 0.5 && Math.abs(deltaY) < 0.5) return;

        element.style.transition = 'none';
        element.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
        element.style.zIndex = '2';
        moved.push(element);
      });

      if (!moved.length) return;
      document.body.offsetHeight;

      requestAnimationFrame(() => {
        moved.forEach(element => {
          element.style.transition = `transform ${MOVE_ANIMATION_MS}ms cubic-bezier(0.2, 0.8, 0.2, 1)`;
          element.style.transform = 'translate(0, 0)';
        });

        setTimeout(() => {
          moved.forEach(element => {
            element.style.transition = '';
            element.style.transform = '';
            element.style.zIndex = '';
          });
        }, MOVE_ANIMATION_MS + 40);
      });
    }

    function trackVisualTransitions(items, suppliedContext = null) {
      const context = suppliedContext || buildDisplayContext(items);
      const current = new Map();

      items.forEach(item => {
        const id = String(item.id || '');
        if (!id) return;
        current.set(id, getEffectiveDisplayStatus(item, context));
      });

      if (!visualStateInitialized) {
        previousVisualItemStatuses = current;
        visualStateInitialized = true;
        return;
      }

      current.forEach((status, id) => {
        const previousStatus = previousVisualItemStatuses.get(id);
        if (!previousStatus || previousStatus === status) return;

        cancelReorderHold(id);
        const item = context.itemById.get(id);
        if (!item) return;
        const attached = context.parentByChildId.has(id);
        const type = canonicalType(item.type);
        const shouldHold = status === 'completed' && !attached && (type === 'order' || isOperationalType(type));

        if (shouldHold) {
          const holdUntil = Date.now() + TERMINAL_REORDER_HOLD_MS;
          reorderHolds.set(id, {
            rank: getRankForTypeAndStatus(item, previousStatus, context),
            until: holdUntil
          });

          const timer = setTimeout(() => {
            reorderHoldTimers.delete(id);
            reorderHolds.delete(id);
            forceRenderLatest();
          }, TERMINAL_REORDER_HOLD_MS);

          reorderHoldTimers.set(id, timer);
        }
      });

      Array.from(reorderHolds.keys()).forEach(id => {
        if (!current.has(id)) cancelReorderHold(id);
      });

      previousVisualItemStatuses = current;
    }

    function cancelReorderHold(id) {
      const timer = reorderHoldTimers.get(id);
      if (timer) clearTimeout(timer);
      reorderHoldTimers.delete(id);
      reorderHolds.delete(id);
    }

    function forceRenderLatest() {
      if (!latestData || connectionErrorActive) return;
      const settings = latestData.settings || {};
      const items = Array.isArray(latestData.items) ? latestData.items : [];
      const context = buildDisplayContext(items);
      const visibleItems = prepareVisibleItems(items, settings, context);
      const dynamicTitle = updateDynamicScreenTitle(visibleItems);
      renderPreparedItems(visibleItems, settings);
      lastRenderSignature = JSON.stringify({
        theme: settings.theme,
        title: dynamicTitle,
        items: visibleItems
      });
    }

    function updateDynamicScreenTitle(items) {
      const title = getDynamicScreenTitle(items);
      const titleElement = document.getElementById('screenTitle');
      if (titleElement && titleElement.textContent !== title) titleElement.textContent = title;
      return title;
    }

    function getDynamicScreenTitle(items) {
      const visibleOrders = (Array.isArray(items) ? items : [])
        .filter(item => canonicalType(item && item.type) === 'order');

      if (!visibleOrders.length) return DEFAULT_SCREEN_TITLE;

      const waitingCount = visibleOrders.reduce((count, item) => {
        return count + (getMainOrderStatus(item && item.status) === 'waiting' ? 1 : 0);
      }, 0);

      return `Objednávky - ${waitingCount} ${getAcceptedOrderWord(waitingCount)}`;
    }

    function getAcceptedOrderWord(count) {
      if (count === 1) return 'přijatá';
      if (count >= 2 && count <= 4) return 'přijaté';
      return 'přijatých';
    }

    function updateDynamicScreenTitleFromRenderedItems() {
      if (!latestData) return updateDynamicScreenTitle([]);

      const items = Array.isArray(latestData.items) ? latestData.items : [];
      const renderedItems = items.filter(item => {
        const id = String(item && item.id || '');
        return id && renderedItemIds.has(id);
      });

      return updateDynamicScreenTitle(renderedItems);
    }

    function createDisplayItem(item, options = {}) {
      const type = canonicalType(item.type);
      if (type === 'message' || type === 'big_text') return createMessage(item, options);
      if (type === 'image' || type === 'photo' || type === 'picture' || type === 'gallery') return createMedia(item, options);
      if (type === 'checklist') return createChecklist(item, options);
      if (type === 'table') return createTable(item, options);
      if (isOperationalType(type)) return createOperationalCard(item, options);
      return createCard(item, options);
    }

    function applyAutomaticLayout(element, item, index, items, layoutContext = {}) {
      const type = canonicalType(item.type);
      const count = items.length;
      const layoutDensity = count >= 3 ? 'layout-many' : (count === 2 ? 'layout-pair' : 'layout-single');
      element.classList.add('display-item', 'type-' + safeClass(type), layoutDensity);
      const data = parseDataJson(item.data_json);
      const requested = String(data.span || data.width || '').toLowerCase();
      const status = type === 'order' ? getMainOrderStatus(item.status) : getOperationalStatus(item.status);

      if (requested === 'full') return element.classList.add('span-12');
      if (requested === 'wide') return element.classList.add('span-8');
      if (requested === 'half') return element.classList.add('span-6');
      if (requested === 'third' || requested === 'normal') return element.classList.add('span-4');

      // Samostatné nouzové upozornění musí být maximálně viditelné.
      if (type === 'alert' && status !== 'completed') return element.classList.add('span-12');
      if (type === 'reminder' && status !== 'completed' && isRingingReminder(item)) return element.classList.add('span-12');
      if (count === 1) return element.classList.add('span-12');

      // Pokud je v řádku alespoň jedna objednávka s připnutou kartou,
      // dostane taková rodičovská skupina celý řádek. Ostatní objednávky
      // se pod ní skládají po dvou; poslední lichá objednávka využije celou
      // šířku. Připnuté informace tak nikdy nejsou namačkané v úzkém sloupci.
      if (type === 'order' && Array.isArray(layoutContext.tierEntries)) {
        const orderEntries = layoutContext.tierEntries.filter(value => value.kind === 'order-group');
        const hasAttachedOrder = orderEntries.some(value => Array.isArray(value.children) && value.children.length);

        if (hasAttachedOrder) {
          const currentEntry = layoutContext.entry;
          if (currentEntry && Array.isArray(currentEntry.children) && currentEntry.children.length) {
            return element.classList.add('span-12');
          }

          const simpleOrders = orderEntries.filter(value => !Array.isArray(value.children) || value.children.length === 0);
          const simpleIndex = simpleOrders.indexOf(currentEntry);
          if (simpleOrders.length % 2 === 1 && simpleIndex === simpleOrders.length - 1) {
            return element.classList.add('span-12');
          }
          return element.classList.add('span-6');
        }
      }

      if (type === 'message' || type === 'big_text') return element.classList.add('span-12');
      if (type === 'table') return element.classList.add('span-8');

      const isMedia = ['image', 'photo', 'picture', 'gallery'].includes(type);
      const isOperational = isOperationalType(type);
      const hasWidePanels = isOperational && getOperationalPanels(item, data).length >= 2;

      if (hasWidePanels && count <= 3) return element.classList.add('span-8');

      if (count === 2) {
        const other = items[index === 0 ? 1 : 0];
        const otherType = canonicalType(other.type);
        const otherIsMedia = ['image', 'photo', 'picture', 'gallery'].includes(otherType);

        if (isMedia && !otherIsMedia) return element.classList.add('span-8');
        if (!isMedia && otherIsMedia) return element.classList.add('span-4');
        return element.classList.add('span-6');
      }

      if (type === 'order' || isOperational) return element.classList.add('span-4');
      element.classList.add(isMedia ? 'span-8' : 'span-4');
    }

          </div>

    function updateClockDisplays() {
      const now = new Date();
      const timeText = PRAGUE_CLOCK_FORMATTER.format(now);

      const compactClock = document.getElementById('compactClock');
      if (compactClock) compactClock.textContent = timeText;

        );
