    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && activeOrderDetailItem) closeOrderDetail();
    });

    /* =========================
       VIEWPORT / ORIENTATION
       ========================= */

    let viewportUpdateFrame = null;

    function updateViewportProfile() {
      const root = document.documentElement;
      const width = Math.max(root.clientWidth || 0, window.innerWidth || 0);
      const height = Math.max(root.clientHeight || 0, window.innerHeight || 0);
      const portrait = window.matchMedia
        ? window.matchMedia('(orientation: portrait)').matches
        : height >= width;

      const orientation = portrait ? 'portrait' : 'landscape';
      const displaySize = width < 700 ? 'compact' : (width < 1400 ? 'medium' : 'large');

      document.body.dataset.orientation = orientation;
      document.body.dataset.displaySize = displaySize;
      root.style.setProperty('--viewport-height', Math.max(1, height) + 'px');
    }

    function scheduleViewportProfileUpdate() {
      if (viewportUpdateFrame !== null) cancelAnimationFrame(viewportUpdateFrame);
      viewportUpdateFrame = requestAnimationFrame(() => {
        viewportUpdateFrame = null;
        updateViewportProfile();
        scheduleVisibilityIndicatorUpdate({ settle: true });
      });
    }

    window.addEventListener('resize', scheduleViewportProfileUpdate, { passive: true });
    window.addEventListener('orientationchange', scheduleViewportProfileUpdate, { passive: true });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scheduleViewportProfileUpdate, { passive: true });
    }

    updateViewportProfile();

    /* =========================
       FULLSCREEN
       ========================= */

    function getFullscreenElement() {
      return document.fullscreenElement || document.webkitFullscreenElement || null;
    }

    async function toggleFullscreen() {
      const root = document.documentElement;

      try {
        if (!getFullscreenElement()) {
          if (root.requestFullscreen) {
            try {
              await root.requestFullscreen({ navigationUI: 'hide' });
            } catch (firstError) {
              await root.requestFullscreen();
            }
          } else if (root.webkitRequestFullscreen) {
            root.webkitRequestFullscreen();
          }
        } else if (document.exitFullscreen) {
          await document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      } catch (error) {
        console.warn('Fullscreen není v tomto prohlížeči nebo kontextu dostupný:', error);
      } finally {
        updateFullscreenButton();
      }
    }

    function updateFullscreenButton() {
      const active = Boolean(getFullscreenElement());
      const button = document.getElementById('fullscreenToggle');
      const icon = document.getElementById('fullscreenIcon');
      const label = document.getElementById('fullscreenLabel');
      if (!button || !icon || !label) return;

      if (active) {

        button.setAttribute('aria-label', 'Ukončit celou obrazovku');

        label.textContent = 'Celá obrazovka';
        button.setAttribute('aria-label', 'Přejít na celou obrazovku');
        button.title = 'Celá obrazovka';
      }

      scheduleViewportProfileUpdate();
    }

    document.getElementById('fullscreenToggle').addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', updateFullscreenButton);
    document.addEventListener('webkitfullscreenchange', updateFullscreenButton);

    /* =========================
       SCREEN WAKE LOCK
       ========================= */

    async function requestScreenWakeLock() {
      if (!('wakeLock' in navigator)) return;
      if (document.visibilityState !== 'visible') return;
      if (wakeLockSentinel && !wakeLockSentinel.released) return;
      if (wakeLockRequestInFlight) return;

      wakeLockRequestInFlight = true;
      clearTimeout(wakeLockRetryTimer);
      wakeLockRetryTimer = null;

      try {
        const sentinel = await navigator.wakeLock.request('screen');

        // Stránka mohla během čekání přejít na pozadí.
        if (document.visibilityState !== 'visible') {
          await sentinel.release();
          return;
        }

        wakeLockSentinel = sentinel;
        sentinel.addEventListener('release', () => {
          if (wakeLockSentinel === sentinel) wakeLockSentinel = null;
          if (document.visibilityState === 'visible') scheduleWakeLockRetry(1000);
        }, { once: true });
      } catch (error) {
        console.warn('Wake Lock se nepodařilo aktivovat:', error);
        if (document.visibilityState === 'visible') scheduleWakeLockRetry(15000);
      } finally {
        wakeLockRequestInFlight = false;
      }
    }

    function scheduleWakeLockRetry(delayMs) {
      if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
      clearTimeout(wakeLockRetryTimer);
      wakeLockRetryTimer = setTimeout(() => {
        wakeLockRetryTimer = null;
        requestScreenWakeLock();
      }, Math.max(250, Number(delayMs) || 1000));
    }

    async function releaseScreenWakeLock() {
      clearTimeout(wakeLockRetryTimer);
      wakeLockRetryTimer = null;

      const sentinel = wakeLockSentinel;
      wakeLockSentinel = null;
      if (!sentinel || sentinel.released) return;

      try {
        await sentinel.release();
      } catch (error) {
        console.warn('Wake Lock se nepodařilo uvolnit:', error);
      }
    }

    function handlePageVisibilityChange() {
      if (document.visibilityState === 'visible') {
        requestScreenWakeLock();
        if (alertSirenWanted && audioUnlocked) ensureAlertSirenCycle(0);
        if (reminderAlarmWanted && audioUnlocked) restartReminderAlarmCycle(0);
      } else {
        releaseScreenWakeLock();
        // Alarmy nesmí pokračovat na pozadí; po návratu navážou novým cyklem.
        stopAlertSirenCycle();
        stopReminderAlarmCycle();
      }
    }

    document.addEventListener('visibilitychange', handlePageVisibilityChange);
    window.addEventListener('pageshow', requestScreenWakeLock);
    window.addEventListener('focus', requestScreenWakeLock);

    document.getElementById('soundUnlock').addEventListener('pointerdown', unlockAudio);
    document.addEventListener('pointerdown', () => {
      requestScreenWakeLock();
      if (soundEnabled && !audioUnlocked) unlockAudio();
    }, { passive: true });

    /* =========================
       UTILITIES
       ========================= */

    function parseDataJson(value) {
      if (!value) return {};
      if (typeof value === 'object') return value;

      try {
        const parsed = JSON.parse(value);
        if (parsed && typeof parsed === 'object') return parsed;
      } catch (error) {
        console.warn('Neplatná data_json:', value);
      }

      return {};
    }

    function normalizeType(value) {
      return String(value || 'card').trim().toLowerCase();
    }

    function canonicalType(value) {
      const normalized = normalizeType(value)
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, '_');

      const aliases = {
        objednavka: 'order', order: 'order',
        reminder: 'reminder', pripominka: 'reminder', task_reminder: 'reminder',
        tip: 'tip', hint: 'tip', rada: 'tip',
        info: 'info', information: 'info', informace: 'info',
        alert: 'alert', warning: 'alert', upozorneni: 'alert', emergency: 'alert'
      };

      return aliases[normalized] || normalized;
    }

    function isOperationalType(value) {
      return OPERATIONAL_TYPES.has(canonicalType(value));
    }

    function normalizeStatus(value) {
      return String(value || '').toLowerCase();
    }

    function getStatusLabel(status) {
      const labels = {
        active: 'Aktivní',
        waiting: 'Čekající',
        completed: 'Hotovo',
        done: 'Hotovo',
        resolved: 'Hotovo',
        served: 'Hotovo',
        cancelled: 'Zrušeno',
        canceled: 'Zrušeno'
      };

      return labels[status] || String(status || '').replace(/_/g, ' ');
    }

    function getMainOrderStatus(status) {
      const normalized = normalizeStatus(status);
      if (isCancelledStatus(normalized)) return 'cancelled';
      if (normalized === 'served' || isCompletedStatus(normalized)) return 'completed';
      return 'waiting';
    }

    function getOperationalStatus(status) {
      const normalized = normalizeStatus(status);
      if (isCompletedStatus(normalized) || normalized === 'served' || normalized === 'resolved' || normalized === 'closed' || isCancelledStatus(normalized)) {
        return 'completed';
      }
      return 'active';
    }

    function isTerminalOrderStatus(status) {
      return status === 'completed' || status === 'cancelled';
    }

    function isCancelledStatus(status) {
      return status === 'cancelled' || status === 'canceled';
    }

    function isCompletedStatus(status) {
      return status === 'completed' || status === 'done' || status === 'resolved' || status === 'closed';
    }

    function getParentOrderId(item) {
      const data = parseDataJson(item && item.data_json);
      return String(
        data.parent_order_id || data.parentOrderId || data.pinned_to_order_id || data.pinnedToOrderId ||
        data.attached_to_order_id || data.attachedToOrderId || data.attached_to || data.attachedTo ||
        data.pinned_to || data.pinnedTo || data.order_id || data.orderId || data.parent_id || ''
      ).trim();
    }

    function looksLikeUrl(value) {
      return typeof value === 'string' && /^https?:\/\//i.test(value.trim());
    }

    function safeClass(value) {
      return String(value).toLowerCase().replace(/[^a-z0-9_-]/g, '_');
    }

    function clampNumber(value, fallback, min, max) {
      const number = Number(value);
      if (!Number.isFinite(number)) return fallback;
      return Math.min(max, Math.max(min, number));
    }

    function toBoolean(value, fallback) {
      if (typeof value === 'boolean') return value;
      if (typeof value === 'number') return value !== 0;
      if (typeof value === 'string') {
        const normalized = value.trim().toLowerCase();
        if (['true', '1', 'yes', 'on'].includes(normalized)) return true;
        if (['false', '0', 'no', 'off'].includes(normalized)) return false;
      }
      return fallback;
    }

    function applyTheme(theme) {
      document.body.classList.toggle('light', String(theme).toLowerCase() === 'light');
    }

    function hasVisibleDisplayItems() {
      return Boolean(document.querySelector('#content .display-item'));
    }

    function setConnectionErrorState(active) {
      const nextState = Boolean(active);
      const changed = connectionErrorActive !== nextState;
      connectionErrorActive = nextState;

      updateConnectionPresentation();
      updateClockDisplays();

      if (changed && nextState) triggerConnectionAlertPulse();
    }

    function updateConnectionPresentation() {
      const content = document.getElementById('content');
      const hasItems = hasVisibleDisplayItems();
      let emptyState = content ? content.querySelector('.empty') : null;

      // Při třetí po sobě jdoucí chybě zobraz varování i tehdy,
      // pokud se aplikaci ještě nepodařilo načíst první datový snímek.
      if (connectionErrorActive && !hasItems && !emptyState) {
        renderEmptyState();
        return;
      }

      const topbarStatus = document.getElementById('topbarStatus');
      if (topbarStatus) {
        topbarStatus.hidden = !hasItems;
        topbarStatus.classList.toggle('connection-error', connectionErrorActive);
      }

      if (emptyState) {
        emptyState.classList.toggle('connection-error', connectionErrorActive);
      }
    }

    function triggerConnectionAlertPulse() {
      requestAnimationFrame(() => {
        const target = hasVisibleDisplayItems()
          ? document.getElementById('topbarStatus')
          : document.querySelector('#content .empty');

        if (!target) return;
        target.classList.remove('connection-alert-pulse');
        void target.offsetWidth;
        target.classList.add('connection-alert-pulse');

        setTimeout(() => target.classList.remove('connection-alert-pulse'), 780);
      });
    }

    /* V16.5 — device-local battery warning, no Sheet / archive writes.
       Availability depends on the browser AND the embedding Permissions Policy. */
    const BATTERY_WARNING_STORAGE_KEY = 'displayApp.batteryWarnings.v1';
    const BATTERY_LOW_THRESHOLD = 0.10;
    const BATTERY_CRITICAL_THRESHOLD = 0.05;
    const BATTERY_LOW_REARM_LEVEL = 0.15;
    const BATTERY_CRITICAL_REARM_LEVEL = 0.07;
    const BATTERY_WARNING_DURATIONS = { low: 30000, critical: 60000 };
    let batteryManager = null;
    let batteryAccessState = 'initializing';
    let batteryAccessReason = '';
    let batteryFlags = readBatteryWarningFlags();
    let activeBatteryWarning = null;
    let batteryWarningTimer = null;
    let batteryWarningNodes = [];
    let batterySwallowUntil = 0;
    let batteryTapCandidate = null;
    const batteryShieldPointers = new Set();
    let normalAudioBus = null;
    const normalToneNodes = new Set();
    let deferredBatteryAlertScroll = [];
    let deferredBatteryReminderScroll = [];

    function readBatteryWarningFlags() {
      try {
        const raw = JSON.parse(localStorage.getItem(BATTERY_WARNING_STORAGE_KEY) || '{}');
        return { low: raw.low === true, critical: raw.critical === true };
      } catch (error) { return { low: false, critical: false }; }
    }
    function persistBatteryWarningFlags() {
      try { localStorage.setItem(BATTERY_WARNING_STORAGE_KEY, JSON.stringify(batteryFlags)); }
      catch (error) { /* In-memory protection still works when storage is denied. */ }
    }
    function isBatteryWarningActive() { return Boolean(activeBatteryWarning); }

    async function initializeBatteryWatch() {
      if (typeof navigator.getBattery !== 'function') {
        batteryAccessState = 'unsupported';
        batteryAccessReason = 'Prohlížeč zde neposkytuje navigator.getBattery().';
        return;
      }
      try {
        const policy = document.permissionsPolicy || document.featurePolicy;
        if (policy && typeof policy.allowsFeature === 'function') {
          const known = typeof policy.features !== 'function' || policy.features().includes('battery');
          if (known && !policy.allowsFeature('battery')) {
            batteryAccessState = 'blocked';
            batteryAccessReason = 'Přístup k baterii blokuje Permissions Policy nadřazené stránky.';
            console.warn('[Display App] ' + batteryAccessReason);
            return;
          }
        }
        batteryManager = await navigator.getBattery();
        batteryAccessState = 'ready';
        batteryAccessReason = '';
        batteryManager.addEventListener('levelchange', evaluateBatteryState);
        batteryManager.addEventListener('chargingchange', evaluateBatteryState);
        evaluateBatteryState();
      } catch (error) {
        batteryAccessState = error && (error.name === 'NotAllowedError' || error.name === 'SecurityError') ? 'blocked' : 'error';
        batteryAccessReason = String(error && error.message || error || 'Battery API selhalo.');
        console.warn('[Display App] Battery Watch není dostupný:', batteryAccessReason);
      }
    }

    function evaluateBatteryState() {
      if (!batteryManager) return;
      const level = Number(batteryManager.level);
      if (!Number.isFinite(level) || level < 0 || level > 1) return;
      let changed = false;
      if (level > BATTERY_LOW_REARM_LEVEL + 0.000001 && batteryFlags.low) { batteryFlags.low = false; changed = true; }
      if (level > BATTERY_CRITICAL_REARM_LEVEL + 0.000001 && batteryFlags.critical) { batteryFlags.critical = false; changed = true; }
      if (changed) persistBatteryWarningFlags();
      if (batteryManager.charging) { finishBatteryWarning('charging'); return; }
      if (activeBatteryWarning && Date.now() >= activeBatteryWarning.endsAt) finishBatteryWarning('elapsed');
      // At <=5% skip the low level entirely; escalation cancels the 30s burst.
      if (level <= BATTERY_CRITICAL_THRESHOLD + 0.000001 && !batteryFlags.critical) {
        startBatteryWarning('critical');
      } else if (level <= BATTERY_LOW_THRESHOLD + 0.000001 && !batteryFlags.low && !activeBatteryWarning) {
        startBatteryWarning('low');
      }
    }

    function startBatteryWarning(stage) {
      if (batteryManager && batteryManager.charging) return;
      if (!BATTERY_WARNING_DURATIONS[stage]) return;
      clearTimeout(batteryWarningTimer);
      stopBatteryWarningAudio();
      batteryFlags.low = true;
      if (stage === 'critical') batteryFlags.critical = true;
      persistBatteryWarningFlags();
      activeBatteryWarning = { stage, startedAt: Date.now(), endsAt: Date.now() + BATTERY_WARNING_DURATIONS[stage] };
      cancelActiveManualGestures();
      cancelAlertAutoScroll();
      document.querySelectorAll('.manual-swipe-ghost').forEach(node => node.remove());
      pendingSounds = [];
      normalToneNodes.forEach(pair => {
        try { pair.oscillator.stop(); } catch (error) {}
        try { pair.oscillator.disconnect(); pair.gain.disconnect(); } catch (error) {}
      });
      normalToneNodes.clear();
      // Preserve alertSirenWanted and the user's mute preference, only stop sound.
      stopAlertSirenCycle();
      stopReminderAlarmNodes();
      updateNormalAudioPriority();
      const overlay = document.getElementById('batteryWarningOverlay');
      overlay.dataset.stage = stage;
      overlay.setAttribute('aria-label', stage === 'critical'
        ? 'Kriticky nízká baterie, nejvýše 5 procent. Klepnutím zavřete výstrahu.'
        : 'Nízká baterie, nejvýše 10 procent. Klepnutím zavřete výstrahu.');
      overlay.hidden = false;
      overlay.setAttribute('aria-hidden', 'false');
      document.body.classList.add('battery-warning-active');
      startBatteryWarningAudio();
      batteryWarningTimer = setTimeout(() => finishBatteryWarning('elapsed'), BATTERY_WARNING_DURATIONS[stage]);
    }

    function finishBatteryWarning(reason) {
      if (!activeBatteryWarning) return;
      activeBatteryWarning = null;
      clearTimeout(batteryWarningTimer);
      batteryWarningTimer = null;
      stopBatteryWarningAudio();
      const overlay = document.getElementById('batteryWarningOverlay');
      overlay.hidden = true;
      overlay.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('battery-warning-active');
      // Also eat the synthetic click after touch/pointerup and held pointer tails.
      batterySwallowUntil = performance.now() + 450;
      updateNormalAudioPriority();
      if (latestData) refreshAlertSirenFromLatest();
      refreshReminderAudioSuppression();
      const alerts = deferredBatteryAlertScroll.splice(0);
      const reminders = deferredBatteryReminderScroll.splice(0);
      if (alerts.length) scheduleNewAlertAutoScroll(alerts);
      else if (reminders.length) scheduleNewReminderAutoScroll(reminders);
    }

    function getNormalAudioDestination() {
      if (!audioContext) return null;
      if (!normalAudioBus) {
        normalAudioBus = audioContext.createGain();
        normalAudioBus.gain.value = isBatteryWarningActive() ? 0 : 1;
        normalAudioBus.connect(audioContext.destination);
      }
      return normalAudioBus;
    }
    function updateNormalAudioPriority() {
      if (normalAudioBus && audioContext) {
        normalAudioBus.gain.cancelScheduledValues(audioContext.currentTime);
        normalAudioBus.gain.setValueAtTime(isBatteryWarningActive() ? 0 : 1, audioContext.currentTime);
      }
    }

    function startBatteryWarningAudio() {
      if (!activeBatteryWarning || batteryWarningNodes.length || !soundEnabled ||
          !audioUnlocked || !audioContext || audioContext.state !== 'running') return;
      const remaining = (activeBatteryWarning.endsAt - Date.now()) / 1000;
      if (remaining <= 0) { finishBatteryWarning('elapsed'); return; }
      const critical = activeBatteryWarning.stage === 'critical';
      const now = audioContext.currentTime;
      const carrier = audioContext.createOscillator();
      const overtone = audioContext.createOscillator();
      const sweep = audioContext.createOscillator();
      const sweepGain = audioContext.createGain();
      const gain = audioContext.createGain();
      const overtoneGain = audioContext.createGain();
      const filter = audioContext.createBiquadFilter();
      // Different timbre, pitch and sweep rate from the Alert's 720Hz sawtooth.
      carrier.type = critical ? 'square' : 'triangle';
      carrier.frequency.setValueAtTime(critical ? 920 : 510, now);
      overtone.type = 'sine';
      overtone.frequency.setValueAtTime(critical ? 1380 : 810, now);
      sweep.type = critical ? 'triangle' : 'sine';
      sweep.frequency.setValueAtTime(critical ? 1.8 : 0.52, now);
      sweepGain.gain.setValueAtTime(critical ? 280 : 115, now);
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(critical ? 2800 : 1700, now);
      filter.Q.setValueAtTime(0.5, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(soundVolume * (critical ? 0.083 : 0.061), now + 0.10);
      overtoneGain.gain.setValueAtTime(0.0001, now);
      overtoneGain.gain.exponentialRampToValueAtTime(soundVolume * (critical ? 0.026 : 0.016), now + 0.10);
      // Hardware audio deadlines stop sound even if background JS is throttled.
      const end = now + remaining;
      gain.gain.setTargetAtTime(0.0001, Math.max(now + 0.11, end - 0.08), 0.02);
      overtoneGain.gain.setTargetAtTime(0.0001, Math.max(now + 0.11, end - 0.08), 0.02);
      sweep.connect(sweepGain);
      sweepGain.connect(carrier.frequency);
      carrier.connect(filter);
      filter.connect(gain);
      overtone.connect(overtoneGain);
      // Battery bypasses the muted normal-sound bus.
      gain.connect(audioContext.destination);
      overtoneGain.connect(audioContext.destination);
      carrier.start(now); overtone.start(now); sweep.start(now);
      carrier.stop(end); overtone.stop(end); sweep.stop(end);
      batteryWarningNodes = [carrier, overtone, sweep, sweepGain, gain, overtoneGain, filter];
    }
    function stopBatteryWarningAudio() {
      batteryWarningNodes.forEach(node => {
        try { if (typeof node.stop === 'function') node.stop(); } catch (error) {}
        try { node.disconnect(); } catch (error) {}
      });
      batteryWarningNodes = [];
    }

    function interceptBatteryPointer(event) {
      const active = isBatteryWarningActive();
      const held = batteryShieldPointers.has(event.pointerId);
      const swallowing = performance.now() < batterySwallowUntil;
      if (!active && !held && !swallowing) return;
      if (event.cancelable) event.preventDefault();
      event.stopImmediatePropagation();
      if (event.type === 'pointerdown') {
        batteryShieldPointers.add(event.pointerId);
        if (active) {
          if (batteryShieldPointers.size === 1) batteryTapCandidate = { id: event.pointerId, x: event.clientX, y: event.clientY, moved: false };
          else batteryTapCandidate = null;
          // A browser gesture can unlock future sounds, but this gesture NEVER
          // activates a card underneath the battery overlay.
          if (!audioUnlocked) unlockAudio();
        }
      } else if (event.type === 'pointermove' && batteryTapCandidate && batteryTapCandidate.id === event.pointerId) {
        if (Math.hypot(event.clientX - batteryTapCandidate.x, event.clientY - batteryTapCandidate.y) > 16) batteryTapCandidate.moved = true;
      } else if (event.type === 'pointerup' || event.type === 'pointercancel') {
        batteryShieldPointers.delete(event.pointerId);
        if (active && event.type === 'pointerup' && batteryTapCandidate &&
            batteryTapCandidate.id === event.pointerId && !batteryTapCandidate.moved) finishBatteryWarning('tap');
        batteryTapCandidate = null;
        batterySwallowUntil = performance.now() + 450;
      }
    }
    ['pointerdown', 'pointermove', 'pointerup', 'pointercancel'].forEach(type => {
      window.addEventListener(type, interceptBatteryPointer, { capture: true, passive: false });
    });
    ['click', 'dblclick', 'contextmenu'].forEach(type => {
      window.addEventListener(type, event => {
        if (!isBatteryWarningActive() && performance.now() >= batterySwallowUntil) return;
        if (event.cancelable) event.preventDefault();
        event.stopImmediatePropagation();
        if (type === 'click' && isBatteryWarningActive() && event.detail === 0) finishBatteryWarning('accessible-click');
      }, true);
    });
    ['keydown', 'keyup'].forEach(type => {
      window.addEventListener(type, event => {
        if (!isBatteryWarningActive() && performance.now() >= batterySwallowUntil) return;
        if (event.cancelable) event.preventDefault();
        event.stopImmediatePropagation();
        if (type === 'keydown' && ['Enter', ' ', 'Escape'].includes(event.key)) finishBatteryWarning('keyboard');
      }, true);
    });
    window.addEventListener('pageshow', evaluateBatteryState);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { evaluateBatteryState(); startBatteryWarningAudio(); }
    });
    window.DisplayAppDiagnostics = Object.freeze({
      getBatteryStatus: () => ({
        version: String(DISPLAY_APP_VERSION), availability: batteryAccessState, reason: batteryAccessReason,
        levelPercent: batteryManager ? Math.round(Number(batteryManager.level) * 100) : null,
        charging: batteryManager ? Boolean(batteryManager.charging) : null,
        activeWarning: activeBatteryWarning ? activeBatteryWarning.stage : null,
        remainingMs: activeBatteryWarning ? Math.max(0, activeBatteryWarning.endsAt - Date.now()) : 0,
        audioReady: Boolean(audioUnlocked && audioContext && audioContext.state === 'running'),
        acknowledged: { low: batteryFlags.low, critical: batteryFlags.critical }
      })
    });

    setInterval(updateTimers, 1000);
    setInterval(updateClockDisplays, 1000);
    setInterval(pruneCompletedItems, 1000);
    setInterval(() => {
      if (!latestData || document.visibilityState !== 'visible') return;
      const items = Array.isArray(latestData.items) ? latestData.items : [];
      const context = buildDisplayContext(items);
      const current = new Set(getRingingReminderIds(items, context));
      if (current.size !== previousRingingReminderIds.size || Array.from(current).some(id => !previousRingingReminderIds.has(id))) {
        handleScheduledReminderDue();
      }
    }, 1000);

    updateClockDisplays();
    initializeVisibilityIndicatorTracking();
    requestScreenWakeLock();
    initializeBatteryWatch();
    refreshDisplay();
  </script>
</body>
</html>
