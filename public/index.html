    function createCard(item, options = {}) {
      const type = canonicalType(item.type);
      const status = options.displayStatus || getEffectiveDisplayStatus(item);
      const card = document.createElement('article');
      card.className = 'card';

      if (type === 'order') card.classList.add('order');
      applyCardState(card, item, options.displayStatus);
      appendSectionLabel(card, item);
      card.appendChild(createCardHeader(item, true, status));

      if (item.body) {
        if (type === 'order') card.appendChild(createOrderBody(item));
        else {
          const body = document.createElement('div');
          body.className = 'card-body';
          body.textContent = item.body;
          card.appendChild(body);
        }
      }

      if (type === 'order' && shouldShowOrderTimer(status) && item.created_at) {
        const meta = document.createElement('div');
        meta.className = 'order-meta';
        const timer = document.createElement('span');
        timer.className = 'order-timer';
        timer.dataset.timerStart = item.created_at;
        meta.appendChild(timer);
        card.appendChild(meta);
        updateTimerElement(timer);
      }

      return card;
    }

    function createOrderBody(item) {
      const wrapper = document.createElement('div');
      wrapper.className = 'order-lines';

      const data = parseDataJson(item.data_json);
      const servedItems = new Set(
        getServedOrderItems(data).map(value => normalizeOrderItemText(value))
      );

      String(item.body || '')
        .split('\n')
        .map(line => line.trim())
        .filter(Boolean)
        .forEach(line => {
          const row = document.createElement('div');
          row.className = 'order-line';

          const cleanLine = stripServedSuffix(line);
          const normalized = normalizeOrderItemText(cleanLine);
          const explicitlyMarkedServed = /(?:—|–|-)\s*(?:vydan[áa]|served|hotov[áa])\s*$/i.test(line);

          if (servedItems.has(normalized) || explicitlyMarkedServed) {
            row.classList.add('served-item');
          }

          row.textContent = cleanLine;
          wrapper.appendChild(row);
        });

      return wrapper;
    }

    function getServedOrderItems(data) {
      const values = [];

      if (Array.isArray(data.served_items)) {
        data.served_items.forEach(item => {
          if (typeof item === 'string') values.push(item);
          else if (item && typeof item === 'object') values.push(item.text || item.title || item.name || '');
        });
      }

      if (Array.isArray(data.items)) {
        data.items.forEach(item => {
          if (!item || typeof item !== 'object') return;
          const status = normalizeStatus(item.status);
          if (status === 'served' || status === 'completed' || status === 'done') {
            values.push(item.text || item.title || item.name || '');
          }
        });
      }

      return values.filter(Boolean);
    }

    function stripServedSuffix(value) {
      return String(value || '')
        .replace(/\s*(?:—|–|-)\s*(?:vydan[áa]|served|hotov[áa])\s*$/i, '')
        .trim();
    }

    function normalizeOrderItemText(value) {
      return stripServedSuffix(value)
        .replace(/^\s*\d+\s*[×x]\s*/i, '')
        .trim()
        .toLocaleLowerCase('cs-CZ');
    }

    function createOperationalCard(item, options = {}) {
      const type = canonicalType(item.type);
      const data = parseDataJson(item.data_json);
      const displayStatus = options.displayStatus || getOperationalStatus(item.status);
      const attached = Boolean(options.attached);
      const card = document.createElement('article');
      card.className = 'card operational-card operational-' + safeClass(type);
      if (attached) card.classList.add('is-attached');
      applyCardState(card, item, displayStatus);
      if (type === 'reminder' && displayStatus !== 'completed' && isRingingReminder(item)) {
        card.classList.add('reminder-ringing');
      }

      if (type === 'info') {
        const infoIcon = document.createElement('div');
        infoIcon.className = 'info-corner-icon';
        infoIcon.setAttribute('aria-hidden', 'true');
        infoIcon.textContent = 'ⓘ';
        card.appendChild(infoIcon);
      }

      if (type === 'alert') {
        ['left', 'right'].forEach(side => {
          const icon = document.createElement('div');
          icon.className = 'alert-corner-icon ' + side;
          icon.setAttribute('aria-hidden', 'true');
          icon.textContent = '⚠';

        });
      }

      const chrome = document.createElement('div');
      chrome.className = 'operational-chrome';

      const kind = document.createElement('div');
      kind.className = 'operational-kind';
      const iconText = getOperationalIcon(type);
      if (iconText) {
        const kindIcon = document.createElement('span');
        kindIcon.className = 'operational-kind-icon';
        kindIcon.setAttribute('aria-hidden', 'true');
        kindIcon.textContent = iconText;
        kind.appendChild(kindIcon);
      }
      const kindText = document.createElement('span');
      kindText.textContent = getOperationalTypeLabel(type);
      kind.appendChild(kindText);
      chrome.appendChild(kind);

      const actions = document.createElement('div');
      actions.className = 'operational-chrome-actions';

      if (attached) {
        const pin = document.createElement('span');
        pin.className = 'attachment-badge';

        if (options.parentOrder && options.parentOrder.title) {
          pin.title = 'Připnuto k objednávce: ' + options.parentOrder.title;
        }
        actions.appendChild(pin);
      }


      if (displayStatus === 'completed') {
        const completed = document.createElement('span');
        completed.className = 'operational-completed-badge';
        completed.textContent = '✓ Hotovo';
        actions.appendChild(completed);
      }

      if (actions.childNodes.length) chrome.appendChild(actions);
      card.appendChild(chrome);

      const title = document.createElement('div');
      title.className = 'operational-title';
      title.textContent = item.title || getOperationalDefaultTitle(type);
      card.appendChild(title);

      if (item.subtitle) {
        const subtitle = document.createElement('div');
        subtitle.className = 'operational-subtitle';
        subtitle.textContent = item.subtitle;
        card.appendChild(subtitle);
      }

      const content = createOperationalContent(item, data, type);
      if (content) card.appendChild(content);
      return card;
    }

    function createOperationalContent(item, data, type) {
      const layout = String(data.layout || data.presentation || '').toLowerCase();
      const panels = getOperationalPanels(item, data);
      const bodyText = getNonRedundantOperationalBody(item);

      if (panels.length && (panels.length > 1 || ['split', 'two_columns', 'panels', 'tiles', 'columns'].includes(layout))) {
        const grid = document.createElement('div');
        grid.className = 'operational-panels ' + (panels.length === 1 ? 'panels-1' : panels.length === 2 ? 'panels-2' : panels.length === 3 ? 'panels-3' : 'panels-many');

        panels.forEach(panel => {
          const box = document.createElement('section');
          box.className = 'operational-panel';

          if (panel.label) {
            const label = document.createElement('div');
            label.className = 'operational-panel-label';
            label.textContent = panel.label;
            box.appendChild(label);
          }

          if (panel.value) {
            const value = document.createElement('div');
            value.className = 'operational-panel-value';
            value.textContent = panel.value;
            box.appendChild(value);
          }

          if (panel.note) {
            const note = document.createElement('div');
            note.className = 'operational-panel-note';
            note.textContent = panel.note;
            box.appendChild(note);
          }

          grid.appendChild(box);
        });

        return grid;
      }

      const tasks = getOperationalTasks(data);
      if (tasks.length || layout === 'checklist') {
        const list = document.createElement('div');
        list.className = 'operational-list';
        tasks.forEach(task => {
          const row = document.createElement('div');
          row.className = 'operational-list-row';
          const box = document.createElement('span');
          box.className = 'operational-task-box';
          const text = document.createElement('span');
          text.textContent = task;
          row.appendChild(box);
          row.appendChild(text);
          list.appendChild(row);
        });
        if (list.childNodes.length) return list;
      }

      const listItems = getOperationalListItems(data);
      if (listItems.length || layout === 'list') {
        const list = document.createElement('div');
        list.className = 'operational-list';
        listItems.forEach(value => {
          const row = document.createElement('div');
          row.className = 'operational-list-row';
          const marker = document.createElement('span');
          marker.className = 'operational-list-marker';
          marker.textContent = type === 'alert' ? '!' : '•';
          const text = document.createElement('span');
          text.textContent = value;
          row.appendChild(marker);
          row.appendChild(text);
          list.appendChild(row);
        });
        if (list.childNodes.length) return list;
      }

      const bigValue = data.value || data.big_value || data.bigValue;
      if (bigValue || ['banner', 'big', 'metric', 'value'].includes(layout)) {
        const value = document.createElement('div');
        value.className = 'operational-big-value';
        value.textContent = String(bigValue || bodyText || '');
        return value.textContent ? value : null;
      }

      if (bodyText) {
        const body = document.createElement('div');
        body.className = 'operational-body';
        body.textContent = bodyText;
        return body;
      }

      return null;
    }

    function getNonRedundantOperationalBody(item) {
      const body = String(item && item.body || '').trim();
      if (!body) return '';

      const title = String(item && item.title || '').trim();
      if (!title) return body;
      return isOperationalTextRedundant(title, body) ? '' : body;
    }

    function isOperationalTextRedundant(title, body) {
      const titleTokens = normalizeOperationalComparisonTokens(title);
      const bodyTokens = normalizeOperationalComparisonTokens(body);
      if (!titleTokens.length || !bodyTokens.length) return false;
      if (titleTokens.join(' ') === bodyTokens.join(' ')) return true;

      const fillerWords = new Set([
        'je', 'jsou', 'jsem', 'jsme', 'byl', 'byla', 'bylo', 'byly', 'bude', 'budou',
        'ma', 'maji', 'mit', 'byt', 'se', 'prave', 'nyni', 'aktualne', 'zrovna',
        'probiha', 'probehlo', 'hotov', 'hotova', 'hotove', 'hotovy',
        'dokoncena', 'dokonceno', 'dokonceny', 'vyrobena', 'vyrobeno',
        'pripraven', 'pripravena', 'pripraveno', 'pripraveny'
      ]);
      const compactTitle = titleTokens.filter(token => !fillerWords.has(token));
      const compactBody = bodyTokens.filter(token => !fillerWords.has(token));

      if (compactTitle.length && compactBody.length &&
          compactTitle.join(' ') === compactBody.join(' ')) {
        return true;
      }

      return false;
    }

    function normalizeOperationalComparisonTokens(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[̀-ͯ]/g, '')
        .toLocaleLowerCase('cs-CZ')
        .replace(/[^a-z0-9]+/g, ' ')
        .trim()
        .split(/\s+/)
        .filter(Boolean);
    }

    function getOperationalPanels(item, suppliedData = null) {
      const data = suppliedData || parseDataJson(item.data_json);
      let source = data.panels || data.boxes || data.tiles || data.columns;

      if (!Array.isArray(source)) {
        source = [];
        if (data.left) source.push(normalizeOperationalPanel(data.left, 'VLEVO'));
        if (data.right) source.push(normalizeOperationalPanel(data.right, 'VPRAVO'));
      }

      const panels = source
        .map((panel, index) => normalizeOperationalPanel(panel, index === 0 ? 'VLEVO' : index === 1 ? 'VPRAVO' : ''))
        .filter(panel => panel.label || panel.value || panel.note);

      if (panels.length) return panels;

      const layout = String(data.layout || '').toLowerCase();
      if (!['split', 'two_columns', 'panels', 'tiles', 'columns'].includes(layout)) return [];

      return String(item.body || '')
        .split('\n')
        .map(line => line.trim())
        .filter(Boolean)
        .map((line, index) => {
          if (line.startsWith('←')) return { label: 'VLEVO', value: line.replace(/^←\s*/, ''), note: '' };
          if (line.endsWith('→')) return { label: 'VPRAVO', value: line.replace(/\s*→$/, ''), note: '' };
          const match = line.match(/^([^:–—-]{2,24})\s*[:–—-]\s*(.+)$/);
          if (match) return { label: match[1], value: match[2], note: '' };
          return { label: index === 0 ? 'VLEVO' : index === 1 ? 'VPRAVO' : '', value: line, note: '' };
        });
    }

    function normalizeOperationalPanel(panel, fallbackLabel = '') {
      if (typeof panel === 'string') {
        const match = panel.match(/^([^:–—-]{2,24})\s*[:–—-]\s*(.+)$/);
        return match
          ? { label: match[1], value: match[2], note: '' }
          : { label: fallbackLabel, value: panel, note: '' };
      }

      if (!panel || typeof panel !== 'object') return { label: '', value: '', note: '' };
      return {
        label: String(panel.label || panel.heading || panel.position || fallbackLabel || ''),
        value: String(panel.value || panel.text || panel.title || panel.body || ''),
        note: String(panel.note || panel.subtitle || panel.caption || '')
      };
    }

    function getOperationalTasks(data) {
      const tasks = Array.isArray(data.tasks) ? data.tasks : [];
      return tasks
        .map(task => typeof task === 'string' ? task : (task && (task.text || task.title || task.name)))
        .filter(Boolean)
        .map(String);
    }

    function getOperationalListItems(data) {
      const items = Array.isArray(data.items) ? data.items : (Array.isArray(data.list) ? data.list : []);
      return items
        .map(value => typeof value === 'string' ? value : (value && (value.text || value.title || value.name)))
        .filter(Boolean)
        .map(String);
    }

    function getOperationalIcon(type) {
      const icons = { reminder: '◷', tip: '✦', info: '', alert: '' };
      return Object.prototype.hasOwnProperty.call(icons, type) ? icons[type] : '•';
    }

    function getOperationalTypeLabel(type) {
      const labels = { reminder: 'Připomínka', tip: 'Tip', info: 'Informace', alert: 'Upozornění' };
      return labels[type] || 'Provozní karta';
    }

    function getOperationalDefaultTitle(type) {
      const labels = { reminder: 'Nová připomínka', tip: 'Provozní tip', info: 'Informace', alert: 'Důležité upozornění' };
      return labels[type] || 'Provozní sdělení';
    }

    function createChecklist(item, options = {}) {
      const card = document.createElement('article');
      card.className = 'card';
      applyCardState(card, item, options.displayStatus);
      appendSectionLabel(card, item);
      card.appendChild(createCardHeader(item, false, options.displayStatus));

      const list = document.createElement('div');
      list.className = 'checklist';

      getChecklistTasks(item).forEach(task => {
        const row = document.createElement('div');
        row.className = 'checklist-row';
        const box = document.createElement('span');
        box.className = 'check-circle';
        const text = document.createElement('span');
        text.textContent = task.text;
        row.appendChild(box);
        row.appendChild(text);
        list.appendChild(row);
      });

      card.appendChild(list);
      return card;
    }

    function getChecklistTasks(item) {
      const data = parseDataJson(item.data_json);

      if (Array.isArray(data.tasks)) {
        return data.tasks
          .map(task => {
            if (typeof task === 'string') return { text: task, completed: false };
            return {
              text: String(task.text || task.title || ''),
              completed: Boolean(task.completed || task.done)
            };
          })
          .filter(task => task.text && !task.completed);
      }

      return String(item.body || '')
        .split('\n')
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => {
          const completed = /^(☑|✅|✔)/.test(line) || /^\[x\]/i.test(line) || /^-\s*\[x\]/i.test(line);
          const cleaned = line
            .replace(/^(☑|✅|✔|☐)\s*/, '')
            .replace(/^-\s*\[[x ]\]\s*/i, '')
            .replace(/^\[[x ]\]\s*/i, '');
          return { text: cleaned, completed };
        })
        .filter(task => task.text && !task.completed);
    }

    function createMessage(item, options = {}) {
      const card = document.createElement('section');
      card.className = 'card message-card';
      applyCardState(card, item, options.displayStatus);
      appendSectionLabel(card, item);

      const title = document.createElement('div');
      title.className = 'message-title';
      title.textContent = item.title || item.body || '';
      card.appendChild(title);

      if (item.subtitle) {
        const subtitle = document.createElement('div');
        subtitle.className = 'message-subtitle';
        subtitle.textContent = item.subtitle;
        card.appendChild(subtitle);
      }

      if (item.body && item.body !== item.title) {
        const body = document.createElement('div');
        body.className = 'card-body';
        body.textContent = item.body;
        card.appendChild(body);
      }

      return card;
    }

    function createMedia(item, options = {}) {
      const images = getImages(item);
      const data = parseDataJson(item.data_json);
      if (images.length > 1) return createGallery(item, images, options);

      const card = document.createElement('section');
      card.className = 'card media-card';
      applyCardState(card, item, options.displayStatus);

      const image = images[0];
      if (!image) {
        const error = document.createElement('div');
        error.className = 'media-error';
        error.textContent = 'Obrázek není k dispozici';
        card.appendChild(error);
        return card;
      }

      const fit = String(data.fit || image.fit || 'contain').toLowerCase();
      const bodyIsImageUrl = looksLikeUrl(item.body);
      const descriptiveBody = bodyIsImageUrl ? '' : String(item.body || '');
      const layout = String(data.layout || '').toLowerCase();

      if ((layout === 'image_text' || layout === 'text_image') && (item.title || item.subtitle || descriptiveBody)) {
        const split = document.createElement('div');
        split.className = 'media-split';
        if (layout === 'text_image') split.classList.add('reverse');

        const imageSide = createImageWrapper(image, fit);
        const textSide = document.createElement('div');
        textSide.className = 'media-split-text';

        if (item.title) {
          const title = document.createElement('div');
          title.className = 'media-split-title';
          title.textContent = item.title;
          textSide.appendChild(title);
        }

        const textContent = descriptiveBody || item.subtitle || image.caption || '';
        if (textContent) {
          const body = document.createElement('div');
          body.className = 'media-split-body';
          body.textContent = textContent;
          textSide.appendChild(body);
        }

        if (layout === 'text_image') {
          split.appendChild(textSide);
          split.appendChild(imageSide);
        } else {
          split.appendChild(imageSide);
          split.appendChild(textSide);
        }

        card.appendChild(split);
        return card;
      }

      card.appendChild(createImageWrapper(image, fit));

      if (item.title || item.subtitle || image.caption || descriptiveBody) {
        const info = document.createElement('div');
        info.className = 'media-info';

        if (item.title) {
          const title = document.createElement('div');
          title.className = 'media-title';
          title.textContent = item.title;
          info.appendChild(title);
        }

        const captionText = descriptiveBody || item.subtitle || image.caption || '';
        if (captionText) {
          const caption = document.createElement('div');
          caption.className = 'media-caption';
          caption.textContent = captionText;
          info.appendChild(caption);
        }

        card.appendChild(info);
      }

      return card;
    }

    function createGallery(item, images, options = {}) {
      const card = document.createElement('section');
      card.className = 'card media-card';
      applyCardState(card, item);

      const gallery = document.createElement('div');
      gallery.className = 'gallery ' + (images.length === 2 ? 'two' : images.length === 3 ? 'three' : 'many');

      images.forEach(image => {
        const wrapper = document.createElement('div');
        wrapper.className = 'gallery-item';
        const img = document.createElement('img');
        img.className = 'gallery-image';
        img.src = image.url;
        img.alt = image.alt || item.title || 'Obrázek';
        img.addEventListener('error', () => {
          wrapper.innerHTML = '<div class="media-error">Obrázek se nepodařilo načíst</div>';
        });
        wrapper.appendChild(img);

        if (image.caption) {
          const caption = document.createElement('div');
          caption.className = 'gallery-caption';
          caption.textContent = image.caption;
          wrapper.appendChild(caption);
        }

        gallery.appendChild(wrapper);
      });

      card.appendChild(gallery);

      if (item.title || item.subtitle) {
        const info = document.createElement('div');
        info.className = 'media-info';

        if (item.title) {
          const title = document.createElement('div');
          title.className = 'media-title';
          title.textContent = item.title;
          info.appendChild(title);
        }

        if (item.subtitle) {
          const caption = document.createElement('div');
          caption.className = 'media-caption';
          caption.textContent = item.subtitle;
          info.appendChild(caption);
        }

        card.appendChild(info);
      }

      return card;
    }

    function createImageWrapper(image, fit) {
      const wrapper = document.createElement('div');
      wrapper.className = 'media-image-wrapper';
      const img = document.createElement('img');
      img.className = 'media-image';
      if (fit === 'cover') img.classList.add('cover');
      img.src = image.url;
      img.alt = image.alt || image.caption || 'Obrázek';
      img.addEventListener('error', () => {
        wrapper.innerHTML = '<div class="media-error">Obrázek se nepodařilo načíst</div>';
      });
      wrapper.appendChild(img);
      return wrapper;
    }

    function getImages(item) {
      const data = parseDataJson(item.data_json);
      const result = [];

      if (Array.isArray(data.images)) {
        data.images.forEach(image => {
          if (typeof image === 'string') {
            result.push({ url: image });
          } else if (image && typeof image === 'object') {
            const url = image.url || image.image_url || image.imageUrl;
            if (url) {
              result.push({
                url,
                caption: image.caption || '',
                alt: image.alt || '',
                fit: image.fit || ''
              });
            }
          }
        });
      }

      const singleUrl = data.image_url || data.imageUrl || data.url;
      if (singleUrl && !result.length) {
        result.push({
          url: singleUrl,
          caption: data.caption || '',
          alt: data.alt || '',
          fit: data.fit || ''
        });
      }

      if (!result.length && looksLikeUrl(item.body)) result.push({ url: item.body });
      return result;
    }

    function createTable(item, options = {}) {
      const card = document.createElement('section');
      card.className = 'card';
      applyCardState(card, item, options.displayStatus);
      appendSectionLabel(card, item);
      card.appendChild(createCardHeader(item, false, options.displayStatus));

      const data = parseDataJson(item.data_json);
      const columns = Array.isArray(data.columns) ? data.columns : [];
      const rows = Array.isArray(data.rows) ? data.rows : [];

      if (columns.length && rows.length) {
        const wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        const table = document.createElement('table');
        table.className = 'display-table';
        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');

        columns.forEach(column => {
          const th = document.createElement('th');
          th.textContent = column;
          headerRow.appendChild(th);
        });

        thead.appendChild(headerRow);
        const tbody = document.createElement('tbody');

        rows.forEach(row => {
          const tr = document.createElement('tr');
          row.forEach(value => {
            const td = document.createElement('td');
            td.textContent = value;
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });

        table.appendChild(thead);
        table.appendChild(tbody);
        wrap.appendChild(table);
        card.appendChild(wrap);
      }

      return card;
    }

    function createCardHeader(item, showStatus = true, displayStatusOverride = '') {
      const header = document.createElement('div');
      header.className = 'card-header';

      const text = document.createElement('div');
      text.style.minWidth = '0';

      const title = document.createElement('div');
      title.className = 'card-title';
      title.textContent = item.title || 'Bez názvu';
      text.appendChild(title);

      if (item.subtitle) {
        const subtitle = document.createElement('div');
        subtitle.className = 'card-subtitle';
        subtitle.textContent = item.subtitle;
        text.appendChild(subtitle);
      }

      header.appendChild(text);

      if (showStatus && item.status) {
        const rawStatus = normalizeStatus(item.status);
        const type = canonicalType(item.type);
        const displayStatus = displayStatusOverride || (type === 'order'
          ? getMainOrderStatus(rawStatus)
          : isOperationalType(type) ? getOperationalStatus(rawStatus) : rawStatus);
        const badge = document.createElement('div');
        badge.className = 'status ' + safeClass(displayStatus);
        badge.textContent = getStatusLabel(displayStatus);
        header.appendChild(badge);
      }

      return header;
    }

    function appendSectionLabel(element, item) {
      const data = parseDataJson(item.data_json);
      const section = data.section || data.section_title;
      if (!section) return;
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = section;
      element.appendChild(label);
    }

    function applyCardState(element, item, displayStatusOverride = '') {
      const rawStatus = normalizeStatus(item.status);
      const type = canonicalType(item.type);
      const status = displayStatusOverride || (type === 'order'
        ? getMainOrderStatus(rawStatus)
        : isOperationalType(type) ? getOperationalStatus(rawStatus) : rawStatus);
      const priority = Number(item.priority) || 0;

      if (priority >= 10 && type !== 'alert') element.classList.add('urgent');
      else if (priority >= 5 && !isOperationalType(type)) element.classList.add('high');

      if (status === 'waiting' || status === 'active') element.classList.add(status);
      if (status === 'completed' || isCompletedStatus(status)) element.classList.add('completed');
      if (status === 'cancelled' || status === 'canceled') element.classList.add('cancelled');
    }

    function applyCompletionHideTime(element, item, settings, displayStatusOverride = '') {
      if (canonicalType(item.type) === 'checklist') return;
      const status = displayStatusOverride || getEffectiveDisplayStatus(item);
      if (!shouldAutoHideItem(item, status)) return;

      const completedAt = getTerminalVisibilityStartTimestamp(item);
      if (!completedAt) return;

      const seconds = clampNumber(settings.completed_visibility_seconds, 60, 0, 3600);
      element.dataset.hideAt = completedAt + seconds * 1000;
    }

    function getOperationalExpiryTimestamp(item) {
      if (!item || !isOperationalType(item.type) || !item.expires_at) return null;
      const expiry = new Date(item.expires_at);
      return isNaN(expiry.getTime()) ? null : expiry.getTime();
    }

    function reconcileTimedOperationalItems(serverItems) {
      const items = Array.isArray(serverItems) ? serverItems.slice() : [];
      const presentIds = new Set();
      const now = Date.now();

      items.forEach(item => {
        const id = String(item && item.id || '');
        if (!id) return;
        presentIds.add(id);

        const expiresAt = getOperationalExpiryTimestamp(item);
        const isActive = isOperationalType(item.type) && getOperationalStatus(item.status) === 'active';
        if (!expiresAt || !isActive) {
          timedOperationalRegistry.delete(id);
          timedExpiryHandledIds.delete(id);
          return;
        }

        timedOperationalRegistry.set(id, {
          item: { ...item },
          expiresAt
        });

        // Stejné ID lze znovu použít s novým budoucím termínem.
        if (expiresAt > now) timedExpiryHandledIds.delete(id);
      });

      Array.from(timedOperationalRegistry.entries()).forEach(([id, record]) => {
        if (presentIds.has(id)) return;
        if (isPendingVisualItem(id)) return; // A swipe must not resurrect a timed card.

        if (timedExpiryHandledIds.has(id)) {
          timedOperationalRegistry.delete(id);
          timedExpiryHandledIds.delete(id);
          return;
        }

        if (now >= record.expiresAt) {
          // Kód.gs už expirovaný řádek neposílá. Krátce ho proto podržíme
          // v lokálním modelu, aby klient stihl vlastní zvuk a exit animaci.
          items.push({ ...record.item });
          return;
        }

        // Zmizel-li před termínem, šlo o ruční odstranění.
        timedOperationalRegistry.delete(id);
      });

      return items;
    }

    function isTimedOperationalItemExpiredForDisplay(item, displayStatus) {
      const expiresAt = getOperationalExpiryTimestamp(item);
      if (!expiresAt || getOperationalStatus(displayStatus) !== 'active' || Date.now() < expiresAt) return false;

      const id = String(item && item.id || '');
      if (id && renderedItemIds.has(id) && !timedExpiryHandledIds.has(id)) return false;
      return true;
    }

    function applyTimedOperationalExpiry(element, item, displayStatus) {
      const expiresAt = getOperationalExpiryTimestamp(item);
      if (!expiresAt || getOperationalStatus(displayStatus) !== 'active') return;

      element.dataset.timedExpireAt = String(expiresAt);
      element.dataset.timedExpireType = canonicalType(item.type);
    }

    function pruneTimedOperationalItems() {
      document.querySelectorAll('[data-timed-expire-at]').forEach(element => {
        const expiresAt = Number(element.dataset.timedExpireAt);
        const id = String(element.dataset.itemId || '');
        if (isPendingVisualItem(id) || !expiresAt || Date.now() < expiresAt) return;
        if (element.classList.contains('item-exit')) return;
        if (id && (removalInProgress.has(id) || timedExpiryHandledIds.has(id))) return;

        const type = canonicalType(element.dataset.timedExpireType || '');
        if (id) timedExpiryHandledIds.add(id);
        if (isOperationalType(type)) triggerSound(type + '_completed');

        beginAnimatedRemoval(element);

        if (type === 'alert') refreshAlertSirenFromLatest();
      });
    }

    function pruneCompletedItems() {
      // Po potvrzeném výpadku zachovej poslední známé rozložení beze změn.
      if (connectionErrorActive) return;

      pruneTimedOperationalItems();

      document.querySelectorAll('[data-hide-at]').forEach(element => {
        const hideAt = Number(element.dataset.hideAt);
        const id = String(element.dataset.itemId || '');
        if (isPendingVisualItem(id) || !hideAt || Date.now() < hideAt) return;
        if (element.classList.contains('item-exit')) return;
        if (id && removalInProgress.has(id)) return;

        beginAnimatedRemoval(element);
      });
    }

    function beginAnimatedRemoval(element) {
      const id = String(element.dataset.itemId || '');
      const descendantIds = [id, ...Array.from(element.querySelectorAll('[data-item-id]'))
        .map(node => String(node.dataset.itemId || ''))]
        .filter(Boolean);
      descendantIds.forEach(value => removalInProgress.add(value));
      element.classList.add('item-exit');

      setTimeout(() => {
        if (!element.isConnected) {
          descendantIds.forEach(value => removalInProgress.delete(value));
          return;
        }
        const oldRects = captureItemRects(id);
        const tier = element.closest('.display-tier');
        const attachedStack = element.closest('.attached-stack');
        const orderGroup = element.closest('.order-group');
        element.remove();
        if (attachedStack && !attachedStack.querySelector('.attached-item')) {
          attachedStack.remove();
          if (orderGroup) orderGroup.classList.remove('has-attached-items');
        }
        if (tier && !tier.querySelector('.display-item')) tier.remove();

        descendantIds.forEach(value => {
          removalInProgress.delete(value);
          renderedItemIds.delete(value);
          renderedItemStatuses.delete(value);
        });

        updateDynamicScreenTitleFromRenderedItems();

        const remaining = document.querySelectorAll('.display-item');
        if (!remaining.length) {
          renderEmptyState();
          return;
        }

        requestAnimationFrame(() => animateItemsFromRects(oldRects));
        scheduleVisibilityIndicatorUpdate({ settle: true });
      }, EXIT_ANIMATION_MS);
    }

    function shouldAutoHideItem(item, status) {
      const type = canonicalType(item.type);
      if (type === 'order') {
        const mainStatus = getMainOrderStatus(status);
        return mainStatus === 'completed' || mainStatus === 'cancelled';
      }
      if (isOperationalType(type)) return getOperationalStatus(status) === 'completed' || status === 'completed';
      return isCompletedStatus(normalizeStatus(status));
    }

    function readStoredTerminalVisibilityStarts() {
      try {
        const stored = window.sessionStorage.getItem(TERMINAL_VISIBILITY_STORAGE_KEY);
        const parsed = stored ? JSON.parse(stored) : {};
        const result = new Map();

        if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return result;
        Object.entries(parsed).forEach(([id, value]) => {
          const timestamp = Number(value);
          if (id && Number.isFinite(timestamp) && timestamp > 0) result.set(String(id), timestamp);
        });
        return result;
      } catch (error) {
        return new Map();
      }
    }

    function persistTerminalVisibilityStarts() {
      try {
        const value = {};
        terminalVisibilityStarts.forEach((timestamp, id) => {
          if (id && Number.isFinite(timestamp) && timestamp > 0) value[id] = timestamp;
        });

        if (Object.keys(value).length) {
          window.sessionStorage.setItem(TERMINAL_VISIBILITY_STORAGE_KEY, JSON.stringify(value));
        } else {
          window.sessionStorage.removeItem(TERMINAL_VISIBILITY_STORAGE_KEY);
        }
      } catch (error) {
        // Některé privátní režimy mohou sessionStorage odmítnout.
      }
    }

    function synchronizeTerminalVisibilityState(items, settings, suppliedContext = null) {
      const context = suppliedContext || buildDisplayContext(items);
      const currentStatuses = new Map();
      const currentIds = new Set();
      const now = Date.now();
      let changed = false;

      (Array.isArray(items) ? items : []).forEach(item => {
        const id = String(item && item.id || '');
        if (!id) return;
        currentIds.add(id);
        if (isPendingVisualItem(id)) {
          const previous = previousTerminalObservationStatuses.get(id);
          if (previous) currentStatuses.set(id, previous);
          return;
        }

        const status = getEffectiveDisplayStatus(item, context);
        currentStatuses.set(id, { item, status });
        const terminal = shouldAutoHideItem(item, status);

        if (!terminal) {
          if (terminalVisibilityStarts.delete(id)) changed = true;
          return;
        }

        if (!terminalVisibilityStateInitialized) {
          if (!terminalVisibilityStarts.has(id)) {
            // Při úplně novém otevření neobnovuj staré terminální položky na
            // dalších plných 60 s. Jejich první základ vychází z backendového
            // času; refresh stejné záložky ale použije sessionStorage.
            terminalVisibilityStarts.set(id, getCompletionTimestamp(item) || now);
            changed = true;
          }
          return;
        }

        const previous = previousTerminalObservationStatuses.get(id);
        const previouslyTerminal = previous ? shouldAutoHideItem(previous.item, previous.status) : false;

        if (!previous || !previouslyTerminal || previous.status !== status) {
          // Plná doba viditelnosti začíná až ve chvíli, kdy tento displej
          // skutečně zachytí přechod do terminálního stavu. Nový terminální
          // stav stejné položky (např. dokončeno → zrušeno) se bere jako nový
          // přechod a dostane také vlastní plnou dobu.
          terminalVisibilityStarts.set(id, now);
          changed = true;
        } else if (!terminalVisibilityStarts.has(id)) {
          terminalVisibilityStarts.set(id, getCompletionTimestamp(item) || now);
          changed = true;
        }
      });

      Array.from(terminalVisibilityStarts.keys()).forEach(id => {
        if (currentIds.has(id) || isPendingVisualItem(id)) return;
        terminalVisibilityStarts.delete(id);
        changed = true;
      });

      previousTerminalObservationStatuses = currentStatuses;
      terminalVisibilityStateInitialized = true;
      if (changed) persistTerminalVisibilityStarts();
    }

    function getTerminalVisibilityStartTimestamp(item) {
      if (isPendingVisualItem(item && item.id)) return null;
      const id = String(item && item.id || '');
      if (id && terminalVisibilityStarts.has(id)) return terminalVisibilityStarts.get(id);
      return getCompletionTimestamp(item);
    }

    function getCompletionTimestamp(item) {
      const data = parseDataJson(item.data_json);
      const status = normalizeStatus(item.status);
      const candidates = [];

      if (status === 'served') {
        candidates.push(data.served_at, data.servedAt);
      } else if (isCancelledStatus(status)) {
        candidates.push(data.cancelled_at, data.cancelledAt, data.canceled_at, data.canceledAt);
      } else {
        candidates.push(data.completed_at, data.completedAt, data.resolved_at, data.resolvedAt, data.done_at, data.doneAt);
      }

      candidates.push(item.updated_at, item.created_at);

      for (const value of candidates) {
        if (!value) continue;
        const date = new Date(value);
        if (!isNaN(date.getTime())) return date.getTime();
      }

      return null;
    }

    function shouldShowOrderTimer(status) {
      return status === 'waiting';
    }

    function updateTimers() {
      document.querySelectorAll('[data-timer-start]').forEach(updateTimerElement);
    }

    function updateTimerElement(element) {
      const date = new Date(element.dataset.timerStart);
      if (isNaN(date.getTime())) {
        element.textContent = '';
        return;
      }

      const seconds = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
      element.textContent = formatElapsedTime(seconds);
    }

    function formatElapsedTime(seconds) {
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const remainingSeconds = seconds % 60;

      if (hours > 0) {
        return hours + ':' + String(minutes).padStart(2, '0') + ':' + String(remainingSeconds).padStart(2, '0');
      }

      const totalMinutes = Math.floor(seconds / 60);
      return String(totalMinutes).padStart(2, '0') + ':' + String(remainingSeconds).padStart(2, '0');
    }

    /* =========================
       SOUND
       ========================= */

    function configureSound(settings) {
      soundEnabled = toBoolean(settings.sound_enabled, true);
      soundVolume = 1; // Výstup aplikace naplno; hlasitost řídí zařízení.

      const unlock = document.getElementById('soundUnlock');
      if (!soundEnabled) {
        unlock.classList.remove('visible');
        pendingSounds = [];
        alertSirenWanted = false;
        stopAlertSirenCycle();
        reminderAlarmWanted = false;
        stopReminderAlarmCycle();
        stopBatteryWarningAudio();
        return;
      }
      if (isBatteryWarningActive()) startBatteryWarningAudio();

      if (!audioUnlocked) unlock.classList.add('visible');
      else unlock.classList.remove('visible');
    }

    function processDisplaySoundEvents(items, suppliedContext = null) {
      const context = suppliedContext || buildDisplayContext(items);
      const currentStates = buildSoundStateSnapshot(items, context);
      const result = { newAlertAdded: false, newAlertIds: [] };

      // První načtení pouze vytvoří základní stav. Existující obsah po
      // reloadu nepředstírá, že byl právě přidán.
      if (!soundStateInitialized) {
        previousSoundStates = currentStates;
        soundStateInitialized = true;
        return result;
      }

      const parentTerminalTransitions = new Set();
      currentStates.forEach((current, id) => {
        if (current.type !== 'order') return;
        const previous = previousSoundStates.get(id);
        if (previous && previous.status === 'waiting' && isTerminalOrderStatus(current.status)) {
          parentTerminalTransitions.add(id);
        }
      });

      // Objednávky zpracujeme první. Jejich dokončovací zvuk má přednost
      // před automaticky dokončenými podřízenými kartami.
      currentStates.forEach((current, id) => {
        if (current.type !== 'order') return;
        const previous = previousSoundStates.get(id);

        if (!previous) {
          if (current.status === 'completed') triggerSound('completed');
          else if (current.status === 'cancelled') triggerSound('cancelled');
          else triggerSound('new_order');
          return;
        }

        if (previous.status !== current.status) {
          triggerSound(soundKindForStatus(current.status));
          return;
        }

        if (previous.fingerprint !== current.fingerprint) triggerSound('modified');
      });

      currentStates.forEach((current, id) => {
        if (!isOperationalType(current.type)) return;
        const previous = previousSoundStates.get(id);
        const completedByParent = Boolean(current.parentId && parentTerminalTransitions.has(current.parentId));

        if (!previous) {
          if (completedByParent) return;
          if (current.status === 'completed') {
            triggerSound(current.type + '_completed');
          } else {
            // Karta vytvořená už jako připnutá má vlastní kombinovaný zvuk.
            triggerSound(current.parentId ? current.type + '_new_pinned' : current.type + '_new');
            if (current.type === 'alert') registerNewAlertEvent(result, id);
          }
          return;
        }

        if (previous.status !== current.status) {
          if (current.status === 'completed') {
            if (!completedByParent) triggerSound(current.type + '_completed');
          } else {
            triggerSound(current.type + '_new');
            if (current.type === 'alert') registerNewAlertEvent(result, id);
          }
          return;
        }

        // Připnutí existující karty, přesun mezi objednávkami a odepnutí
        // dostávají vlastní zvuky. Přesun A → B zní pouze jako připnutí.
        if (previous.parentId !== current.parentId) {
          triggerSound(current.parentId ? 'card_pinned' : 'card_unpinned');
        }
      });

      previousSoundStates = currentStates;
      return result;
    }

    function registerNewAlertEvent(result, id) {
      result.newAlertAdded = true;
      const value = String(id || '');
      if (value && !result.newAlertIds.includes(value)) result.newAlertIds.push(value);
    }

    function buildSoundStateSnapshot(items, context) {
      const states = new Map();
      items.forEach(item => {
        const id = String(item.id || '');
        if (!id) return;
        const type = canonicalType(item.type);
        if (type !== 'order' && !isOperationalType(type)) return;
        if (isOperationalType(type) && context.declaredParentByChildId.has(id) && !context.parentByChildId.has(id)) return;

        states.set(id, {
          type,
          status: getEffectiveDisplayStatus(item, context),
          parentId: context.parentByChildId.get(id) || '',
          fingerprint: type === 'order' ? getOrderFingerprint(item) : getOperationalFingerprint(item)
        });
      });
      return states;
    }

    function getOrderFingerprint(item) {
      return JSON.stringify({
        title: String(item.title || ''),
        subtitle: String(item.subtitle || ''),
        body: String(item.body || ''),
        priority: Number(item.priority) || 0,
        data_json: String(item.data_json || '')
      });
    }

    function getOperationalFingerprint(item) {
      return JSON.stringify({
        title: String(item.title || ''),
        subtitle: String(item.subtitle || ''),
        body: String(item.body || ''),
        data_json: String(item.data_json || '')
      });
    }

    function soundKindForStatus(status) {
      if (status === 'completed') return 'completed';
      if (status === 'cancelled') return 'cancelled';
      return 'waiting';
    }

    function isAlertCreationSound(kind) {
      return kind === 'alert_new' || kind === 'alert_new_pinned';
    }

    function triggerSound(kind) {
      if (!soundEnabled || isBatteryWarningActive()) return;

      if (!audioUnlocked || !audioContext || audioContext.state !== 'running') {
        pendingSounds.push(kind);
        if (pendingSounds.length > 12) pendingSounds.shift();
        return;
      }

      playSound(kind);
    }

    async function unlockAudio() {
      if (!soundEnabled) return;

      try {
        if (!audioContext) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          audioContext = new AudioContextClass();
        }

        if (audioContext.state !== 'running') await audioContext.resume();

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        gain.gain.value = 0.00001;
        oscillator.connect(gain);
        gain.connect(getNormalAudioDestination());
        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.02);

        audioUnlocked = audioContext.state === 'running';

        if (audioUnlocked) {
          document.getElementById('soundUnlock').classList.remove('visible');
          const queuedAlert = pendingSounds.some(isAlertCreationSound);
          flushPendingSounds();
          if (alertSirenWanted) {
            if (queuedAlert) restartAlertSirenCycle(0);
            else ensureAlertSirenCycle(0);
          }
          if (reminderAlarmWanted) restartReminderAlarmCycle(0);
          startBatteryWarningAudio();
        }
      } catch (error) {
        console.warn('Zvuk se nepodařilo povolit:', error);
      }
    }

    function flushPendingSounds() {
      if (!pendingSounds.length || !audioUnlocked) return;
      const queue = pendingSounds.splice(0, pendingSounds.length);
      queue.forEach((kind, index) => {
        setTimeout(() => playSound(kind), index * 450);
      });
    }

    function playSound(kind) {
      if (!audioContext || audioContext.state !== 'running' || !soundEnabled || isBatteryWarningActive()) return;
      const now = audioContext.currentTime;

      // Objednávky — zachované zvuky v9.
      if (kind === 'new_order') {
        playTone(740, now, 0.16, 'triangle', 0.78);
        playTone(988, now + 0.16, 0.24, 'triangle', 0.90);
        return;
      }
      if (kind === 'modified') {
        playTone(880, now, 0.09, 'square', 0.38);
        playTone(880, now + 0.13, 0.09, 'square', 0.38);
        return;
      }
      if (kind === 'waiting') {
        playTone(587, now, 0.20, 'sine', 0.58);
        return;
      }
      if (kind === 'completed') {
        playTone(659, now, 0.13, 'sine', 0.62);
        playTone(880, now + 0.12, 0.15, 'sine', 0.70);
        playTone(1175, now + 0.25, 0.28, 'sine', 0.82);
        return;
      }
      if (kind === 'cancelled') {
        playTone(440, now, 0.18, 'sine', 0.60);
        playTone(330, now + 0.16, 0.28, 'sine', 0.68);
        return;
      }

      // Univerzální připnutí / odepnutí existující karty.
      if (kind === 'card_pinned') {
        playPinAccent(now, 0.96);
        return;
      }
      if (kind === 'card_unpinned') {
        playUnpinAccent(now, 0.92);
        return;
      }

      // Nová karta vytvořená rovnou jako připnutá: zachová charakter
      // svého typu a zakončí ho společným zvukem „zacvaknutí“.
      if (kind === 'reminder_new_pinned') {
        playTone(523, now, 0.13, 'triangle', 0.53);
        playTone(659, now + 0.13, 0.20, 'triangle', 0.64);
        playPinAccent(now + 0.29, 0.90);
        return;
      }
      if (kind === 'tip_new_pinned') {
        playTone(988, now, 0.08, 'triangle', 0.40);
        playTone(1319, now + 0.09, 0.11, 'triangle', 0.48);
        playTone(1568, now + 0.20, 0.14, 'sine', 0.54);
        playPinAccent(now + 0.31, 0.88);
        return;
      }
      if (kind === 'info_new_pinned') {
        playTone(784, now, 0.12, 'sine', 0.46);
        playTone(1047, now + 0.13, 0.20, 'sine', 0.56);
        playPinAccent(now + 0.29, 0.88);
        return;
      }
      if (kind === 'alert_new_pinned') {
        playTone(880, now, 0.09, 'square', 0.68);
        playTone(880, now + 0.13, 0.09, 'square', 0.68);
        playTone(1175, now + 0.27, 0.18, 'square', 0.79);
        playPinAccent(now + 0.42, 1.00);
        return;
      }

      // Připomínka: měkký dvojzvuk / jasné potvrzení.
      if (kind === 'reminder_new') {
        playTone(523, now, 0.16, 'triangle', 0.56);
        playTone(659, now + 0.16, 0.25, 'triangle', 0.67);
        return;
      }
      if (kind === 'reminder_completed') {
        playTone(659, now, 0.11, 'sine', 0.52);
        playTone(784, now + 0.10, 0.13, 'sine', 0.60);
        playTone(1047, now + 0.22, 0.24, 'sine', 0.72);
        return;
      }

      // Tip: lehký „nápad“ se třpytivou vyšší barvou.
      if (kind === 'tip_new') {
        playTone(988, now, 0.09, 'triangle', 0.42);
        playTone(1319, now + 0.10, 0.12, 'triangle', 0.50);
        playTone(1568, now + 0.22, 0.20, 'sine', 0.58);
        return;
      }
      if (kind === 'tip_completed') {
        playTone(1047, now, 0.12, 'sine', 0.50);
        playTone(831, now + 0.12, 0.20, 'sine', 0.55);
        return;
      }

      // Informace: klidný skleněný dvojzvuk.
      if (kind === 'info_new') {
        playTone(784, now, 0.15, 'sine', 0.48);
        playTone(1047, now + 0.15, 0.26, 'sine', 0.58);
        return;
      }
      if (kind === 'info_completed') {
        playTone(698, now, 0.13, 'sine', 0.46);
        playTone(523, now + 0.12, 0.22, 'sine', 0.50);
        return;
      }

      // Upozornění: výrazný nástup a zřetelný uklidňující konec.
      if (kind === 'alert_new') {
        playTone(880, now, 0.10, 'square', 0.70);
        playTone(880, now + 0.15, 0.10, 'square', 0.70);
        playTone(1175, now + 0.30, 0.24, 'square', 0.82);
        return;
      }
      if (kind === 'alert_completed') {
        playTone(988, now, 0.12, 'sine', 0.62);
        playTone(659, now + 0.12, 0.16, 'sine', 0.56);
        playTone(523, now + 0.27, 0.28, 'sine', 0.50);
        return;
      }

      // Zachování podpory starších stavových zvuků.
      if (kind === 'pending') {
        playTone(523, now, 0.12, 'triangle', 0.52);
        playTone(659, now + 0.13, 0.16, 'triangle', 0.58);
        return;
      }
      if (kind === 'accepted') {
        playTone(784, now, 0.13, 'sine', 0.58);
        playTone(1047, now + 0.12, 0.20, 'sine', 0.68);
        return;
      }
      if (kind === 'active') {
        playTone(698, now, 0.11, 'triangle', 0.50);
        playTone(831, now + 0.11, 0.17, 'triangle', 0.60);
        return;
      }
      if (kind === 'in_progress') {
        playTone(659, now, 0.09, 'triangle', 0.48);
        playTone(784, now + 0.10, 0.10, 'triangle', 0.54);
        playTone(988, now + 0.21, 0.17, 'triangle', 0.62);
        return;
      }
      if (kind === 'ready') {
        playTone(988, now, 0.12, 'sine', 0.62);
        playTone(1319, now + 0.12, 0.30, 'sine', 0.78);
        return;
      }
      if (kind === 'served') {
        playTone(880, now, 0.12, 'sine', 0.54);
        playTone(698, now + 0.12, 0.22, 'sine', 0.50);
        return;
      }

      playTone(740, now, 0.16, 'triangle', 0.50);
    }

    function playPinAccent(startTime, intensity = 1) {
      playTone(392, startTime, 0.045, 'square', 0.36 * intensity);
      playTone(1047, startTime + 0.040, 0.085, 'triangle', 0.56 * intensity);
      playTone(1568, startTime + 0.115, 0.125, 'sine', 0.66 * intensity);
    }

    function playUnpinAccent(startTime, intensity = 1) {
      playTone(1568, startTime, 0.070, 'sine', 0.56 * intensity);
      playTone(988, startTime + 0.070, 0.090, 'triangle', 0.50 * intensity);
      playTone(392, startTime + 0.155, 0.065, 'square', 0.34 * intensity);
    }

    function readStoredAlertSirenMuted() {
      try {
        return window.localStorage.getItem(ALERT_SIREN_MUTE_STORAGE_KEY) === '1';
      } catch (error) {
        return false;
      }
    }

    function readStoredAlertSirenMutedAlertIds() {
      try {
        const stored = window.localStorage.getItem(ALERT_SIREN_MUTED_IDS_STORAGE_KEY);
        const parsed = stored ? JSON.parse(stored) : [];
        return new Set(Array.isArray(parsed) ? parsed.map(String).filter(Boolean) : []);
      } catch (error) {
        return new Set();
      }
    }

    function persistAlertSirenMuted() {
      try {
        if (alertSirenMuted) {
          window.localStorage.setItem(ALERT_SIREN_MUTE_STORAGE_KEY, '1');
          window.localStorage.setItem(
            ALERT_SIREN_MUTED_IDS_STORAGE_KEY,
            JSON.stringify(Array.from(alertSirenMutedAlertIds))
          );
        } else {
          window.localStorage.removeItem(ALERT_SIREN_MUTE_STORAGE_KEY);
          window.localStorage.removeItem(ALERT_SIREN_MUTED_IDS_STORAGE_KEY);
        }
      } catch (error) {
        // Některé privátní režimy mohou localStorage odmítnout.
      }
    }

    function configureAlertAlarmToggleCard(card) {
      card.classList.add('alert-alarm-toggle');
      card.dataset.alertAlarmToggle = 'true';
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-label', 'Přepnout společný alarm upozornění');
      updateAlertAlarmToggleCardState(card);
    }

    function triggerCardPressEffect(card) {
      if (!card) return;
      clearTimeout(card._cardPressReleaseTimer);
      card.classList.remove('card-press-active', 'alert-press-active');
      void card.offsetWidth;
      card.classList.add('card-press-active');
      card._cardPressReleaseTimer = setTimeout(() => {
        card.classList.remove('card-press-active', 'alert-press-active');
        card._cardPressReleaseTimer = null;
      }, 105);
    }

    function triggerAlertPressEffect(card) {
      triggerCardPressEffect(card);
    }

    function updateAlertAlarmToggleCardState(card) {
      if (!card) return;
      card.setAttribute('aria-pressed', String(!alertSirenMuted));
    }

    function updateAlertAlarmIndicators() {
      document.querySelectorAll('[data-alert-alarm-toggle]').forEach(updateAlertAlarmToggleCardState);
    }

    function setAlertSirenMuted(muted, options = {}) {
      const next = Boolean(muted);
      const changed = alertSirenMuted !== next;
      alertSirenMuted = next;

      if (!next) {
        alertSirenMutedAlertIds = new Set();
      } else if (Array.isArray(options.alertIds)) {
        alertSirenMutedAlertIds = new Set(options.alertIds.map(String).filter(Boolean));
      }

      if (options.persist !== false) persistAlertSirenMuted();
      if (options.updateUi !== false) updateAlertAlarmIndicators();
      return changed;
    }

    function isActiveAlertForSiren(item, context) {
      if (canonicalType(item && item.type) !== 'alert') return false;
      const id = String(item && item.id || '');
      if (id && context.declaredParentByChildId.has(id) && !context.parentByChildId.has(id)) return false;
      if (id && timedExpiryHandledIds.has(id)) return false;

      const expiresAt = getOperationalExpiryTimestamp(item);
      if (expiresAt && Date.now() >= expiresAt) return false;
      return getEffectiveDisplayStatus(item, context) !== 'completed';
    }

    function getActiveAlertIds(items, context) {
      return items
        .filter(item => isActiveAlertForSiren(item, context))
        .map(item => String(item && item.id || ''))
        .filter(Boolean);
    }

    function getLatestAlertSirenInput() {
      const items = latestData && Array.isArray(latestData.items) ? latestData.items : [];
      return { items, context: buildDisplayContext(items) };
    }

    function refreshAlertSirenFromLatest(options = {}) {
      const input = getLatestAlertSirenInput();
      updateAlertSirenState(input.items, input.context, options);
    }

    function toggleSharedAlertAlarm() {
      const input = getLatestAlertSirenInput();
      const hasActiveAlert = input.items.some(item => isActiveAlertForSiren(item, input.context));
      if (!hasActiveAlert) return;

      const muted = !alertSirenMuted;
      const activeAlertIds = getActiveAlertIds(input.items, input.context);
      setAlertSirenMuted(muted, { alertIds: muted ? activeAlertIds : [] });

      if (muted) {
        alertSirenWanted = false;
        stopAlertSirenCycle();
        refreshReminderAudioSuppression();
        return;
      }

      alertSirenWanted = Boolean(soundEnabled);
      if (alertSirenWanted && audioUnlocked) restartAlertSirenCycle(0);
      refreshReminderAudioSuppression();
    }

    function playTone(frequency, startTime, duration, waveType, level) {
      if (isBatteryWarningActive()) return;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = waveType;
      oscillator.frequency.setValueAtTime(frequency, startTime);

      const peak = Math.max(0.0001, soundVolume * level * 0.22);
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(peak, startTime + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

      oscillator.connect(gain);
      gain.connect(getNormalAudioDestination());
      oscillator.start(startTime);
      oscillator.stop(startTime + duration + 0.02);
      const tracked = { oscillator, gain };
      normalToneNodes.add(tracked);
      oscillator.onended = () => {
        normalToneNodes.delete(tracked);
        try { oscillator.disconnect(); gain.disconnect(); } catch (error) {}
      };
    }

    function updateAlertSirenState(items, context, options = {}) {
      const startDelayMs = Math.max(0, Number(options.startDelayMs) || 0);
      const restartCycle = Boolean(options.restartCycle);
      const activeAlertIds = getActiveAlertIds(items, context);
      const hasActiveAlert = activeAlertIds.length > 0 || items.some(item => isActiveAlertForSiren(item, context));

      if (!hasActiveAlert) {
        alertSirenWanted = false;
        stopAlertSirenCycle();
        if (!Array.from(pendingManualActions.values()).some(op =>
          Array.from(op.affectedIds).some(id => (authoritativeData.items || []).some(item => String(item.id) === id && canonicalType(item.type) === 'alert')))) {
          setAlertSirenMuted(false);
        }
        refreshReminderAudioSuppression();
        return;
      }

      // Každé skutečně nové upozornění vždy zruší ruční ztlumení.
      const unseenAlertAfterRefresh = alertSirenMuted && activeAlertIds.some(id => !alertSirenMutedAlertIds.has(id));
      if (restartCycle || unseenAlertAfterRefresh) setAlertSirenMuted(false);

      const wanted = soundEnabled && !alertSirenMuted;
      if (!wanted) {
        alertSirenWanted = false;
        stopAlertSirenCycle();
        refreshReminderAudioSuppression();
        return;
      }

      const becameWanted = !alertSirenWanted;
      alertSirenWanted = true;
      if (audioUnlocked && (restartCycle || becameWanted || alertSirenPhase === 'idle')) {
        restartAlertSirenCycle(startDelayMs);
      }
      refreshReminderAudioSuppression();
    }

    function restartAlertSirenCycle(delayMs = 0) {
      stopAlertSirenCycle();
      if (alertSirenWanted) ensureAlertSirenCycle(delayMs);
    }

    function ensureAlertSirenCycle(delayMs = 0) {
      if (isBatteryWarningActive() || !alertSirenWanted || !soundEnabled || !audioUnlocked || !audioContext || audioContext.state !== 'running') return;
      if (alertSirenPhase !== 'idle') return;

      alertSirenPhase = 'scheduled';
      const token = alertSirenCycleToken;
      alertSirenTimer = setTimeout(() => {
        alertSirenTimer = null;
        if (token !== alertSirenCycleToken || !alertSirenWanted) {
          alertSirenPhase = 'idle';
          return;
        }
        startAlertSirenContinuous(token);
      }, Math.max(0, Number(delayMs) || 0));
    }

    function startAlertSirenContinuous(token) {
      if (isBatteryWarningActive() || token !== alertSirenCycleToken || !alertSirenWanted || !audioContext) {
        alertSirenPhase = 'idle';
        return;
      }

      alertSirenPhase = 'playing';
      stopAlertSirenNodes();
      const now = audioContext.currentTime;
      const carrier = audioContext.createOscillator();
      const overtone = audioContext.createOscillator();
      const sweep = audioContext.createOscillator();
      const sweepGain = audioContext.createGain();
      const overtoneSweepGain = audioContext.createGain();
      const gain = audioContext.createGain();
      const overtoneGain = audioContext.createGain();

      carrier.type = 'sawtooth';
      carrier.frequency.setValueAtTime(720, now);
      overtone.type = 'sine';
      overtone.frequency.setValueAtTime(1160, now);
      sweep.type = 'sine';
      sweep.frequency.setValueAtTime(0.82, now);
      sweepGain.gain.setValueAtTime(210, now);
      overtoneSweepGain.gain.setValueAtTime(150, now);

      const peak = Math.max(0.0001, soundVolume * 0.095);
      const overtonePeak = Math.max(0.0001, soundVolume * 0.035);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(peak, now + 0.08);
      overtoneGain.gain.setValueAtTime(0.0001, now);
      overtoneGain.gain.exponentialRampToValueAtTime(overtonePeak, now + 0.08);

      sweep.connect(sweepGain);
      sweep.connect(overtoneSweepGain);
      sweepGain.connect(carrier.frequency);
      overtoneSweepGain.connect(overtone.frequency);
      carrier.connect(gain);
      overtone.connect(overtoneGain);
      gain.connect(getNormalAudioDestination());
      overtoneGain.connect(getNormalAudioDestination());

      carrier.start(now);
      overtone.start(now);
      sweep.start(now);
      alertSirenNodes = [carrier, overtone, sweep, sweepGain, overtoneSweepGain, gain, overtoneGain];
      refreshReminderAudioSuppression();
    }

    // Zachováno jako interní alias kvůli kompatibilitě starších volání.
    function startAlertSirenBurst(token) {
      startAlertSirenContinuous(token);
    }

    function stopAlertSirenNodes() {
      alertSirenNodes.forEach(node => {
        try {
          if (node && typeof node.stop === 'function') node.stop();
          if (node && typeof node.disconnect === 'function') node.disconnect();
        } catch (error) {
          // Uzel už mohl být zastaven.
        }
      });
      alertSirenNodes = [];
    }

    function stopAlertSirenCycle() {
      alertSirenCycleToken += 1;
      clearTimeout(alertSirenTimer);
      alertSirenTimer = null;
      stopAlertSirenNodes();
      alertSirenPhase = 'idle';
      refreshReminderAudioSuppression();
    }

    /* =========================
       ČASOVANÉ PŘIPOMÍNKY v16
       ========================= */

    function getReminderTriggerTimestamp(item) {
      if (canonicalType(item && item.type) !== 'reminder') return null;
      const data = parseDataJson(item && item.data_json);
      const value = data.remind_at || data.remindAt || data.trigger_at || data.triggerAt || '';
      if (!value) return null;
      const date = new Date(value);
      return isNaN(date.getTime()) ? null : date.getTime();
    }

    function isRingingReminder(item, suppliedContext = null) {
      if (canonicalType(item && item.type) !== 'reminder') return false;
      const context = suppliedContext || (latestData && Array.isArray(latestData.items)
        ? buildDisplayContext(latestData.items)
        : null);
      if (getEffectiveDisplayStatus(item, context) === 'completed') return false;
      const triggerAt = getReminderTriggerTimestamp(item);
      if (!triggerAt || Date.now() < triggerAt) return false;
      const expiresAt = getOperationalExpiryTimestamp(item);
      return !expiresAt || Date.now() < expiresAt;
    }

    function getRingingReminderIds(items, context) {
      return (Array.isArray(items) ? items : [])
        .filter(item => isRingingReminder(item, context))
        .map(item => String(item && item.id || ''))
        .filter(Boolean);
    }

    function synchronizeReminderSchedule(items, context) {
      const currentIds = new Set(getRingingReminderIds(items, context));
      const newlyRingingIds = [];
      currentIds.forEach(id => {
        if (!reminderStateInitialized || !previousRingingReminderIds.has(id)) newlyRingingIds.push(id);
      });
      previousRingingReminderIds = currentIds;
      reminderStateInitialized = true;
      scheduleNextReminderDue(items, context);
      return { newlyRingingIds, ringingIds: Array.from(currentIds) };
    }

    function scheduleNextReminderDue(items, context) {
      clearTimeout(reminderDueTimer);
      reminderDueTimer = null;
      const now = Date.now();
      const future = (Array.isArray(items) ? items : [])
        .filter(item => canonicalType(item && item.type) === 'reminder' && getEffectiveDisplayStatus(item, context) !== 'completed')
        .map(getReminderTriggerTimestamp)
        .filter(value => value && value > now)
        .sort((a, b) => a - b);
      if (!future.length) return;
      reminderDueTimer = setTimeout(handleScheduledReminderDue, Math.min(2147483000, Math.max(50, future[0] - now + 20)));
    }

    function handleScheduledReminderDue() {
      reminderDueTimer = null;
      if (!latestData) return;
      renderCurrentDisplayState();
    }

    function updateReminderAlarmState(items, context, options = {}) {
      const hasRingingReminder = getRingingReminderIds(items, context).length > 0;
      if (!hasRingingReminder || !soundEnabled) {
        reminderAlarmWanted = false;
        stopReminderAlarmCycle();
        return;
      }

      const becameWanted = !reminderAlarmWanted;
      reminderAlarmWanted = true;
      if (!audioUnlocked) return;
      if (options.restartCycle || becameWanted || reminderAlarmPhase === 'idle') {
        restartReminderAlarmCycle(0);
      } else {
        refreshReminderAudioSuppression();
      }
    }

    function refreshReminderAlarmFromLatest(options = {}) {
      const items = latestData && Array.isArray(latestData.items) ? latestData.items : [];
      updateReminderAlarmState(items, buildDisplayContext(items), options);
    }

    function restartReminderAlarmCycle(delayMs = 0) {
      stopReminderAlarmCycle();
      if (!reminderAlarmWanted) return;
      reminderAlarmPhase = 'scheduled';
      const token = reminderAlarmCycleToken;
      reminderAlarmTimer = setTimeout(() => startReminderPlayPhase(token, REMINDER_ALARM_PLAY_MS), Math.max(0, delayMs));
    }

    function startReminderPlayPhase(token, durationMs) {
      if (token !== reminderAlarmCycleToken || !reminderAlarmWanted) return;
      clearTimeout(reminderAlarmTimer);
      reminderAlarmPhase = 'playing';
      reminderAlarmPhaseEndsAt = Date.now() + Math.max(100, durationMs || REMINDER_ALARM_PLAY_MS);
      refreshReminderAudioSuppression();
      reminderAlarmTimer = setTimeout(() => startReminderPausePhase(token), Math.max(100, durationMs || REMINDER_ALARM_PLAY_MS));
    }

    function startReminderPausePhase(token) {
      if (token !== reminderAlarmCycleToken || !reminderAlarmWanted) return;
      clearTimeout(reminderAlarmTimer);
      stopReminderAlarmNodes();
      reminderAlarmPhase = 'pause';
      reminderAlarmPhaseEndsAt = Date.now() + REMINDER_ALARM_PAUSE_MS;
      reminderAlarmTimer = setTimeout(() => startReminderPlayPhase(token, REMINDER_ALARM_PLAY_MS), REMINDER_ALARM_PAUSE_MS);
    }

    function isAlertAudioBlockingReminder() {
      return Boolean(alertSirenWanted && !alertSirenMuted);
    }

    function refreshReminderAudioSuppression() {
      if (!reminderAlarmWanted || reminderAlarmPhase !== 'playing') {
        stopReminderAlarmNodes();
        return;
      }
      if (isBatteryWarningActive() || isAlertAudioBlockingReminder() || !audioUnlocked || !audioContext || audioContext.state !== 'running') {
        stopReminderAlarmNodes();
        return;
      }
      if (reminderAlarmNodes.length) return;
      const remaining = reminderAlarmPhaseEndsAt - Date.now();
      if (remaining > 30) startReminderAlarmNodes(remaining);
    }

    function startReminderAlarmNodes(durationMs) {
      if (!audioContext || audioContext.state !== 'running' || durationMs <= 0) return;
      stopReminderAlarmNodes();
      const now = audioContext.currentTime;
      const duration = durationMs / 1000;
      const nodes = [];
      for (let offset = 0; offset < duration; offset += 2.0) {
        const start = now + offset;
        const first = createScheduledToneNode(659, start, Math.min(0.22, duration - offset), 'triangle', 0.52);
        const secondOffset = offset + 0.24;
        if (secondOffset < duration) {
          const second = createScheduledToneNode(880, now + secondOffset, Math.min(0.30, duration - secondOffset), 'sine', 0.66);
          nodes.push.apply(nodes, second);
        }
        nodes.push.apply(nodes, first);
      }
      reminderAlarmNodes = nodes;
    }

    function createScheduledToneNode(frequency, startTime, duration, waveType, level) {
      if (duration <= 0.03) return [];
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = waveType;
      oscillator.frequency.setValueAtTime(frequency, startTime);

      if (type === 'reminder' && displayStatus !== 'completed' && isRingingReminder(item)) {
        triggerCardPressEffect(card);
        sendDisplayAction('complete_reminder', item).then(() => refreshReminderAlarmFromLatest());
      }
    }

    function showDisplayActionToast(message) {
      const toast = document.getElementById('displayActionToast');

      requestAnimationFrame(() => toast.classList.add('is-visible'));
      displayActionToastTimer = setTimeout(() => {
        toast.classList.remove('is-visible');
        setTimeout(() => { toast.hidden = true; }, 160);
      }, 2600);
    }

    function openOrderDetail(item) {
      if (isBatteryWarningActive() || (item && manualActionInFlight.has(String(item.id || '')))) return;
      if (!item || canonicalType(item.type) !== 'order' || getMainOrderStatus(item.status) !== 'waiting') return;

      selectable.forEach((entry, index) => {

      if (!selectable.length) {

    function closeOrderDetail() {
      const overlay = document.getElementById('orderDetailOverlay');
      if (!overlay || overlay.hidden) return;
      overlay.classList.remove('is-visible');
      overlay.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('order-detail-open');
      activeOrderDetailItem = null;
      orderDetailSubmitting = false;
      setTimeout(() => {
        if (!overlay.classList.contains('is-visible')) overlay.hidden = true;
      }, 180);
    }

    function synchronizeOpenOrderDetail(items) {
      if (!activeOrderDetailItem || orderDetailSubmitting) return;
      const activeId = String(activeOrderDetailItem.id || '');
      const fresh = (Array.isArray(items) ? items : []).find(item => String(item && item.id || '') === activeId);
      const stale = !fresh || canonicalType(fresh.type) !== 'order' ||
        getMainOrderStatus(fresh.status) !== 'waiting' ||
        String(fresh.updated_at || '') !== String(activeOrderDetailItem.updated_at || '');
      if (!stale) return;
      closeOrderDetail();
      showDisplayActionToast('Objednávka se mezitím změnila. Detail byl zavřen.');
    }

    function getSelectableOrderItems(item) {
      const data = parseDataJson(item.data_json);
      const pending = Array.isArray(data.pending_items) ? data.pending_items : [];
      const served = Array.isArray(data.served_items) ? data.served_items : [];
      const stateValues = [...pending, ...served]
        .map(value => typeof value === 'string' ? value : (value && (value.text || value.title || value.name)))
        .filter(Boolean)
        .map(String);
      const servedKeys = new Set(served.map(value => normalizeOrderSelectionKey(
        typeof value === 'string' ? value : (value && (value.text || value.title || value.name))
      )).filter(Boolean));
      const stateByKey = new Map();
      stateValues.forEach(value => {
        const key = normalizeOrderSelectionKey(value);
        if (key && !stateByKey.has(key)) stateByKey.set(key, value);
      });

      const bodyLines = String(item.body || '').split('\n').map(value => value.trim()).filter(Boolean);
      const entries = [];
      const used = new Set();
      bodyLines.forEach(line => {
        const key = normalizeOrderSelectionKey(line);
        if (!key || used.has(key)) return;
        if (stateByKey.size && !stateByKey.has(key)) return;
        if (!stateByKey.size && isNonServeableOrderLine(line)) return;
        const value = stateByKey.get(key) || stripOrderLineQuantityForSelection(line);
        entries.push({ value, label: line, served: servedKeys.has(key) });
        used.add(key);
      });
      stateByKey.forEach((value, key) => {
        if (used.has(key)) return;
        entries.push({ value, label: value, served: servedKeys.has(key) });
      });
      return entries;
    }

    function normalizeOrderSelectionKey(value) {
      return stripOrderLineQuantityForSelection(String(value || ''))
        .replace(/\s*\(\s*\d+(?:[.,]\d+)?\s*kč\s*\)\s*$/i, '')
        .replace(/\s+[–—-]\s*\d+(?:[.,]\d+)?\s*kč\s*$/i, '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLocaleLowerCase('cs-CZ')
        .replace(/[^a-z0-9]+/g, ' ')
        .trim();
    }

    function stripOrderLineQuantityForSelection(value) {
      return String(value || '').replace(/^\s*\d+\s*[×x]\s*/i, '').trim();
    }

    function isNonServeableOrderLine(line) {
      return /^(pozn[aá]mka|st[uů]l|cena|celkem|objedn[aá]vka|z[aá]kazn[ií]k)\s*[:–—-]/i.test(String(line || '').trim());
    }

    const orderDetailOverlay = document.getElementById('orderDetailOverlay');
    if (orderDetailOverlay) {
      orderDetailOverlay.addEventListener('click', event => {
        if (event.target === orderDetailOverlay) closeOrderDetail();
      });
